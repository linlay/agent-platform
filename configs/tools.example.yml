# 允许 run_query 请求非 default 权限。默认关闭；修改后重启。
# 开启即信任所有有资格调用 run_query 的 Agent 请求 full_access（仍受目标准入与硬约束限制）。
runQuery:
  allowAccessLevelOverride: false

# Native Agent presets; not written to agent.yml. Restart after changes.
# Omit or set [] to disable.
preset-tools:
  - datetime
  - wait
  - file_read
  - file_write
  - file_edit
  - file_glob
  - file_grep
  - vision_recognize
  - image_generate
  - plan_add_tasks
  - plan_update_task
  - plan_get_tasks
  - ask_user_question
  - artifact_publish

# Tool runtime config. Copy to configs/tools.yml to customize locally.

access-policy:
  # Workspace mutation is decided by the run's editing capability (CODER and
  # GENERAL default to editing=true, KBASE to false), not by write-roots: no
  # approval or access level can mutate a read-only Workspace.
  levels:
    default:
      read-roots:
        - "@workspace"
        - "@chat"
        - "@agent"
        - "@skills"
        - "@temp"
      write-roots:
        - "@chat"
        - "@temp"
      readonly-roots:
        - "@agent"
        - "@skills"
      approvals:
        read-outside-roots: hitl
        write-outside-roots: hitl
        bash-complex-filesystem: hitl
        bash-opaque-command: hitl
        bash-write-in-write-roots: allow
        # Recursive deletion and discarding uncommitted work (rm -r, git reset --hard).
        destructive: hitl
        # .git/hooks and .git/config, which later Git commands execute.
        executable-config: hitl
        # git push, uploads, POST/PUT/DELETE requests.
        remote-mutation: hitl

    auto_approve:
      inherit: default
      approvals:
        read-outside-roots: auto
        write-outside-roots: hitl
        bash-complex-filesystem: auto
        bash-opaque-command: auto
        bash-write-in-write-roots: allow
        destructive: hitl
        executable-config: hitl
        remote-mutation: hitl

    full_access:
      read-roots:
        - "@root"
      write-roots:
        - "@root"
      readonly-roots: []
      approvals:
        read-outside-roots: allow
        write-outside-roots: allow
        bash-complex-filesystem: allow
        bash-opaque-command: allow
        bash-write-in-write-roots: allow
        # Set to hitl to keep confirming these under full_access.
        destructive: allow
        executable-config: allow
        remote-mutation: allow

bash:
  # allowed-commands defaults: Windows "*"; Unix/macOS use the built-in command list.
  # Set allowed-commands explicitly to override the platform default.
  shell-features-enabled: true
  max-command-chars: 16000

  # Host environment passed to tools (NAME or PREFIX*). Omit to use the shipped
  # list of toolchain, proxy and certificate variables. Loader and interpreter
  # injection variables (LD_*, DYLD_*, NODE_OPTIONS, PYTHONPATH, GIT_CONFIG_*...)
  # are never inherited. SSH_AUTH_SOCK is passed only to Git network commands.
  # inherit-env:
  #   - PATH
  #   - HOME
  #   - HTTPS_PROXY
  #   - LC_*

  # Directories that skill .runtime-env.json PATH entries may append besides
  # the skill's own directory. Entries are appended after the system PATH.
  # path-append-roots:
  #   - /opt/company-tools/bin

  # Command-open preset: only opens the command allowlist.
  # allowed-commands: '*'
  # max-command-chars: 32000

  # Unix/macOS shell override example. Default Bash args already enable pipefail
  # and skip login/profile files (--noprofile --norc).
  # shell-executable: bash
  # shell-args:
  #   - --noprofile
  #   - --norc
  #   - -o
  #   - pipefail
  #   - -c
  #   - "{{command}}"

file-tools:
  max-read-bytes: 1048576
  max-write-bytes: 1048576
  require-write-approval: true
  require-read-before-write: true
  read-before-write-scope: chat
  read-before-write-max-age: 60m
  hooks:
    after-file-change:
      lsp-diagnostics:
        enabled: true
        timeout: 3
        languages: ["go", "typescript", "javascript", "python", "rust"]
        servers:
          go:
            command: gopls
            args: []
          typescript:
            command: typescript-language-server
            args: ["--stdio"]
          javascript:
            command: typescript-language-server
            args: ["--stdio"]
          python:
            command: pyright-langserver
            args: ["--stdio"]
          rust:
            command: rust-analyzer
            args: []

# Per-Run dynamic environment; no enabled switch. Values are ordinary observable
# tool data, never secrets. Total bytes count UTF-8 values only, excluding keys.
run-env:
  max-dynamic-keys: 32
  max-value-bytes: 4096
  max-total-bytes: 32768
  deny-keys: []
