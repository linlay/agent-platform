# Tool runtime config. Copy to configs/tools.yml to customize locally.

access-policy:
  # Workspace mutation is decided by the run's editing capability (CODER and
  # GENERAL default to editing=true, KBASE to false), not by write-roots: no
  # approval or access level can mutate a read-only Workspace.
  levels:
    default:
      read-roots:
        - "@workspace"
        - "@chat"
        - "@agent"
        - "@skills"
        - "@temp"
      write-roots:
        - "@chat"
        - "@temp"
      readonly-roots:
        - "@agent"
        - "@skills"
      approvals:
        read-outside-roots: hitl
        write-outside-roots: hitl
        bash-complex-filesystem: hitl
        bash-opaque-command: hitl
        bash-write-in-write-roots: allow
        # Recursive deletion and discarding uncommitted work (rm -r, git reset --hard).
        destructive: hitl
        # .git/hooks and .git/config, which later Git commands execute.
        executable-config: hitl
        # git push, uploads, POST/PUT/DELETE requests.
        remote-mutation: hitl

    auto_approve:
      inherit: default
      approvals:
        read-outside-roots: auto
        write-outside-roots: hitl
        bash-complex-filesystem: auto
        bash-opaque-command: auto
        bash-write-in-write-roots: allow
        destructive: hitl
        executable-config: hitl
        remote-mutation: hitl

    full_access:
      read-roots:
        - "@root"
      write-roots:
        - "@root"
      readonly-roots: []
      approvals:
        read-outside-roots: allow
        write-outside-roots: allow
        bash-complex-filesystem: allow
        bash-opaque-command: allow
        bash-write-in-write-roots: allow
        # Set to hitl to keep confirming these under full_access.
        destructive: allow
        executable-config: allow
        remote-mutation: allow

bash:
  # allowed-commands defaults: Windows "*"; Unix/macOS use the built-in command list.
  # Set allowed-commands explicitly to override the platform default.
  shell-features-enabled: true
  max-command-chars: 16000

  # Host environment passed to tools (NAME or PREFIX*). Omit to use the shipped
  # list of toolchain, proxy and certificate variables. Loader and interpreter
  # injection variables (LD_*, DYLD_*, NODE_OPTIONS, PYTHONPATH, GIT_CONFIG_*...)
  # are never inherited. SSH_AUTH_SOCK is passed only to Git network commands.
  # inherit-env:
  #   - PATH
  #   - HOME
  #   - HTTPS_PROXY
  #   - LC_*

  # Directories that skill .runtime-env.json PATH entries may append besides
  # the skill's own directory. Entries are appended after the system PATH.
  # path-append-roots:
  #   - /opt/company-tools/bin

  # Command-open preset: only opens the command allowlist.
  # allowed-commands: '*'
  # max-command-chars: 32000

  # Unix/macOS shell override example. Default Bash args already enable pipefail
  # and skip login/profile files (--noprofile --norc).
  # shell-executable: bash
  # shell-args:
  #   - --noprofile
  #   - --norc
  #   - -o
  #   - pipefail
  #   - -c
  #   - "{{command}}"

file-tools:
  # file_read 的单次原始载入上限（文本按 40000 字节模型预算分页，可翻页读完更大的文件）；/api/file 与 diff 仍以它作为文件上限。
  max-read-bytes: 1048576
  max-write-bytes: 1048576
  require-write-approval: true
  require-read-before-write: true
  read-before-write-scope: chat
  read-before-write-max-age: 60m
  hooks:
    after-file-change:
      lsp-diagnostics:
        enabled: true
        timeout: 3
        languages: ["go", "typescript", "javascript", "python", "rust"]
        servers:
          go:
            command: gopls
            args: []
          typescript:
            command: typescript-language-server
            args: ["--stdio"]
          javascript:
            command: typescript-language-server
            args: ["--stdio"]
          python:
            command: pyright-langserver
            args: ["--stdio"]
          rust:
            command: rust-analyzer
            args: []

# Per-Run dynamic environment; no enabled switch. Values are ordinary observable
# tool data, never secrets. Total bytes count UTF-8 values only, excluding keys.
run-env:
  max-dynamic-keys: 32
  max-value-bytes: 4096
  max-total-bytes: 32768
  deny-keys: []

# MCP tool mode. When true, mounted MCP connectors' tools are not listed for the
# model; it finds them with mcp_search and calls them with mcp_call. When false,
# every mounted MCP tool is listed directly and the two tools are omitted.
mcp:
  tool-mode: false

vision-recognize:
  enabled: true
  default-profile: general
  profiles:
    general:
      # Must reference a runtime/registries/models/*.yml model with type: vl.
      model-key:
      timeout: 60
      max-images: 4
      max-image-bytes: 20971520
      output-format: text
      system-prompt: |
        You are a visual recognition tool. Describe only observable visual facts.

    ocr:
      model-key:
      timeout: 60
      max-images: 4
      max-image-bytes: 20971520
      output-format: json
      system-prompt: |
        Extract visible text, tables, labels, handwriting, and layout.

web-fetch:
  enabled: true
  default-profile: general
  preapproved-hosts: []
  profiles:
    general:
      model-key:
      timeout: 60
      fetch-timeout: 60
      max-url-length: 2000
      max-response-bytes: 10485760
      max-markdown-chars: 100000
      # Answer budget. Reasoning models get extra headroom on top of this.
      max-output-tokens: 4000
      system-prompt: |
        You extract and summarize fetched web content according to the user's prompt.

image-generate:
  enabled: true
  default-profile:
  # 各 profile 的 timeout 可省略或设为 0，沿用有效 budget.tool.timeout（默认 600 秒）。
  # 显式正数只增加图片调用时限，不能延长工具或 Run 时限；不继承模型 image.timeout。
  profiles:
    th-gpt-image-2_5-flare:
      model-key: th-gpt-image-2_5-flare
      size: 1024x1024
      response-format: b64_json
      output-mime-type: image/png
      max-prompt-chars: 4000
      max-images: 4
      max-image-bytes: 20971520
      persist-artifact: true
    th-gpt-image-2_5-sunburst:
      model-key: th-gpt-image-2_5-sunburst
      size: 1024x1024
      response-format: b64_json
      output-mime-type: image/png
      max-prompt-chars: 4000
      max-images: 4
      max-image-bytes: 20971520
      persist-artifact: true

speech-generate:
  enabled: true
  default-profile:
  # 模型必须是 type: tts；请求与响应格式由模型 protocol（MINIMAX_TTS / DASHSCOPE_TTS）在源码中实现。
  # voice 为默认音色 ID（各 provider 专属）；voices 可选，列出后只允许这些音色，并在启动时写入工具说明。
  # timeout 可省略或设为 0，沿用有效 budget.tool.timeout；显式正数只缩短语音调用时限。
  # max-text-chars 默认 3000，max-audio-bytes 默认 52428800。
  profiles:
    th-minimax-speech-2_8-hd:
      model-key: th-minimax-speech-2_8-hd
      voice: male-qn-qingse
      format: mp3
      sample-rate: 32000
      max-text-chars: 3000
    qwen-flash:
      model-key: dashscope-qwen3-tts-flash
      voice: Cherry
      # Qwen TTS 单次文本上限 600 字，输出固定为 24kHz WAV。
      max-text-chars: 600
