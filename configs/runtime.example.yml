# Runtime integration config. Copy to configs/runtime.yml to customize locally.

http-proxy:
  mode: auto # auto / direct / fixed
  system-refresh-interval: 15s
  # url: http://127.0.0.1:10809 # fixed 模式
  # bypass: ["*.example.internal"]

skills:
  max-prompt-chars: 8000

query:
  advanced-user-prompt: false

auth:
  enabled: true
  # jwks-uri:
  # issuer:
  # jwks-cache-seconds: 0

resource:
  ticket-ttl-seconds: 86400

budget:
  # 单次 run 执行耗时上限；CODER planning confirmation 的用户等待时间不计入。
  timeout: 3600
  max-steps: 100
  model:
    max-calls: 100
    # 模型流式 idle 超时：首个响应 chunk 或任意两个 chunk 之间超过该秒数无响应则报错。
    timeout: 180
    retry-count: 5
  tool:
    max-calls: 100
    # 单次工具调用硬上限：bash/file/MCP 等工具不能超过该秒数。
    timeout: 600
    retry-count: 0
  hitl:
    timeout: 600
    question:
      timeout: 600
    approval:
      timeout: 600
    form:
      timeout: 600

automation:
  enabled: true
  default-zone-id: Asia/Shanghai
  pool-size: 4

memory:
  enabled: false
  db-file-name: memory.db
  context-top-n: 5
  context-max-chars: 4000
  search-default-limit: 10
  dual-write-markdown: true

# KBASE behavior settings live in configs/kbase-settings.yml.

container-hub:
  base-url: ${AP_CONTAINER_HUB_BASE_URL:http://host.docker.internal:11960}

  # Prefer deployment-rendered YAML or an external Secret for Bearer auth.
  # auth-token:
  default-environment-id:
  request-timeout: 300
  default-sandbox-level: run
  agent-idle-timeout: 600
  destroy-queue-delay: 5

  # 默认挂载由 Platform 自动生成；扩展挂载在 Agent 的 runtimeConfig.sandboxMounts 中配置。
  # mode: ro（只读）或 rw（可读写）。
  # /workspace、/chat、隔离路径及其子路径不可覆盖。
  # 目录映射与扩展写法见 docs/配置化说明.md 的「Container Hub」节。

cors:
  enabled: false
  path-pattern: /api/**
  allowed-origin-patterns:
    - http://localhost:8081
  allowed-methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allowed-headers:
    - "*"
  exposed-headers:
    - Content-Type
    - X-Document-Kind
    - X-Document-Revision
  allow-credentials: false
  max-age-seconds: 3600

billing:
  currency: CNY

# Office readonly preview: local / intranet / internet document-hub.
# Changes take effect after restarting Platform.
document-preview:
  enabled: false
  provider: document-hub
  api-base-url: http://127.0.0.1:8090
  public-base-url: http://127.0.0.1:8090
  auth:
    mode: none # none / bearer-token-file
    # token-file: /absolute/path/to/document-hub-token
  open-mode: iframe # iframe / external
  max-file-bytes: 52428800
  request-timeout: 120s
