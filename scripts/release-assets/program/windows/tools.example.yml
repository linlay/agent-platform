# Windows tool runtime config. Copy to configs/tools.yml to customize locally.

access-policy:
  levels:
    default:
      read-roots:
        - "@workspace"
        - "@chat"
        - "@agent"
        - "@skills"
        - "@temp"
      write-roots:
        - "@workspace"
        - "@chat"
        - "@temp"
      readonly-roots:
        - "@agent"
        - "@skills"
        - "@skills-center"
      approvals:
        read-outside-roots: hitl
        write-outside-roots: hitl
        bash-complex-filesystem: hitl
        bash-opaque-command: hitl
        bash-write-in-write-roots: allow

    auto_approve:
      inherit: default
      approvals:
        read-outside-roots: auto
        write-outside-roots: hitl
        bash-complex-filesystem: auto
        bash-opaque-command: auto
        bash-write-in-write-roots: allow

    full_access:
      read-roots:
        - C:\
      write-roots:
        - C:\
      readonly-roots: []
      approvals:
        read-outside-roots: allow
        write-outside-roots: allow
        bash-complex-filesystem: allow
        bash-opaque-command: allow
        bash-write-in-write-roots: allow

bash:
  allowed-commands: '*'
  shell-features-enabled: true
  shell-executable: powershell.exe
  shell-args:
    - -NoProfile
    - -ExecutionPolicy
    - Bypass
    - -Command
    - "{{command}}"
  max-command-chars: 16000

  # To force cmd.exe instead, use:
  # shell-executable: cmd.exe
  # shell-args:
  #   - /d
  #   - /s
  #   - /c
  #   - "{{command}}"

sandbox-bash:
  security:
    bashsec-overrides:
      output-redirection: auto
      heredoc-output-redirection: auto
    audit-auto-approvals: true

file-tools:
  max-read-bytes: 1048576
  max-write-bytes: 1048576
  max-batch-ops: 20
  require-write-approval: true
  require-read-before-write: true
  read-before-write-scope: run

platform-control:
  enabled: true
  max-dynamic-keys: 32
  max-value-bytes: 4096
  max-total-bytes: 32768
  max-bulk-operations: 16
  deny-keys: []
  profiles:
    run-env:
      operations: [capabilities.list, run.env.bind, run.env.set, run.env.unset, run.env.get, run.env.list, run.env.bulk]
    platform-admin:
      operations: [capabilities.list, catalog.defaults.get, catalog.validate, run.env.bind, run.env.set, run.env.unset, run.env.get, run.env.list, run.env.bulk, runtime.status, security.explain]
  bindings:
    - profile: run-env
      agentKeys: [builtin-httpx.demo, cutej]
    - profile: platform-admin
      agentKeys: [cutej, desktopAssistant, zenmi, zenmiKnowledge]
