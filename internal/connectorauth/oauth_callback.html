<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Authorization response received</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1d1d1f;
      background: #f5f5f7;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: 100%;
      max-width: 440px;
      padding: 48px 36px 44px;
      text-align: center;
      background: #fff;
      border: 1px solid rgba(0, 0, 0, .05);
      border-radius: 24px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, .04), 0 2px 8px rgba(0, 0, 0, .02);
    }
    .icon {
      display: grid;
      place-items: center;
      width: 64px;
      height: 64px;
      margin: 0 auto 26px;
      border-radius: 50%;
      color: #0071e3;
      background: #eef6ff;
    }
    h1 {
      margin: 0 0 14px;
      font-size: 27px;
      font-weight: 600;
      letter-spacing: -.8px;
      line-height: 1.2;
    }
    p {
      max-width: 310px;
      margin: 0 auto;
      color: #6e6e73;
      font-size: 15px;
      line-height: 1.65;
    }
    @media (max-width: 380px) {
      main { padding: 36px 24px; }
      h1 { font-size: 24px; }
    }
    @media (prefers-color-scheme: dark) {
      :root { color: #f5f5f7; background: #161617; }
      main { background: #232325; border-color: rgba(255, 255, 255, .07); }
      .icon { color: #64b5ff; background: #203044; }
      p { color: #a1a1a6; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="title">
    <div class="icon" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
        <path d="m8 15 4.5 4.5L22 10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1 id="title">Response received</h1>
    <p>You can close this page and return to the app where you started.</p>
  </main>
</body>
</html>
