name: surface_element
i18n:
  en:
    label: "Interact with Page Element"
  zh-CN:
    label: "网页元素操作"
description: "Fill, select, focus or scroll one webpage element. Read the web-control skill before use."
clientVisible: true
inputSchema:
  type: object
  properties:
    surfaceId:
      type: string
      description: "Required. Webpage identity."
    selector:
      type: string
      description: "Required. CSS selector."
    action:
      type: string
      enum:
        - fill
        - select
        - focus
        - scroll
      description: "Required. Element action."
    value:
      type: string
      description: "Value for the action."
  required:
    - surfaceId
    - selector
    - action
  additionalProperties: false
