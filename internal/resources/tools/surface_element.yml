name: surface_element
i18n:
  en:
    label: "Interact with Page Element"
  zh-CN:
    label: "网页元素操作"
description: "Interact with a webpage element by observation reference or verified selector. Read the web-control skill before use."
clientVisible: true
inputSchema:
  type: object
  properties:
    surfaceId:
      type: string
      description: "Required. Webpage identity."
    selector:
      type: string
      description: "CSS selector; mutually exclusive with ref."
    ref:
      type: string
      description: "Element reference from surface_observe. Requires observationId; mutually exclusive with selector."
    observationId:
      type: string
      description: "Observation that issued ref. Required with ref."
    action:
      type: string
      enum:
        - fill
        - select
        - focus
        - scroll
        - hover
        - type
        - press
        - check
        - uncheck
      description: "Required. Element action."
    value:
      type: string
      description: "Value for the action."
    values:
      type: array
      maxItems: 100
      items:
        type: string
        maxLength: 4096
      description: "Chrome select values; mutually exclusive with value."
    key:
      type: string
      enum:
        - Enter
        - Escape
        - Tab
        - Shift+Tab
        - ArrowUp
        - ArrowDown
        - ArrowLeft
        - ArrowRight
        - Home
        - End
        - PageUp
        - PageDown
        - Backspace
        - Delete
        - Space
        - ControlOrMeta+A
      description: "Required for the Chrome press action."
  required:
    - surfaceId
    - action
  additionalProperties: false
