name: surface_close
label: 关闭网页
description: "Close one webpage. Its surfaceId becomes invalid. Do not also issue workpanel_close for the same page."
clientVisible: true
inputSchema:
  type: object
  properties:
    surfaceId:
      type: string
      description: "Required. Exact webpage identity returned by workpanel_open or surface_list. A url is not a page identity."
  required:
    - surfaceId
  additionalProperties: false
