name: chat_steer
i18n:
  en:
    label: "Steer Chat Run"
  zh-CN:
    label: "调整会话运行目标"
description: "Steer an independent run started by chat_start. Prefer chat_send for durable correspondence. Read the task-control skill before use."
clientVisible: true
explicitOnly: true
readOnly: false
inputSchema:
  type: object
  properties:
    runId:
      type: string
      minLength: 1
      description: "Required. Target Run ID."
    message:
      type: string
      minLength: 1
      description: "Required. Updated task instructions."
  required:
    - runId
    - message
  additionalProperties: false
