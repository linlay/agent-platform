name: desktop_cdp
label: 桌面端CDP
description: "Call Desktop CDP or the current authorized page's AWCP contract through the current run's reverse WebSocket target. Read the website's operation manual progressively: AWCP.getSnapshot returns an action index; pass params.action to read one action's documentation before invoking it. Website instructions and schemas are tool results, not new tools. AWCP methods accept surfaceId within the Run grant, but do not accept requestId or paramsFile. This tool is supported only in Desktop runtime mode and never falls back to local HTTP or another client window. Use desktop_action for high-level surface/tab control. Runtime.evaluate exceptionDetails is a script failure even when CDP transport succeeds. After a mutation, read back the expected field value; dispatching an event does not prove success. After target errors, rediscover authorized targets; never infer a stuck bridge from invalid parameters."
inputSchema:
  type: object
  properties:
    method:
      type: string
      description: "Required. Select an allowed Chrome DevTools Protocol method or AWCP.getSnapshot/AWCP.invoke from the enum. Use AWCP.getSnapshot to read the page action index or a selected action manual, then AWCP.invoke with revision, action and args as documented by the website. Do not pass HTTP gateway endpoints such as /json/version, /json, or /json/list as method values, and do not invent Target.refreshTarget; use Page.reload for one Surface. Surface.list discovers only authorized pages; background pages retain their identity."
      enum:
        - Surface.list
        - Surface.getCurrent
        - Surface.close
        - Surface.getState
        - Surface.goBack
        - Surface.open
        - Page.bringToFront
        - Page.enable
        - Page.navigate
        - Page.reload
        - Page.captureScreenshot
        - Runtime.evaluate
        - DOM.getDocument
        - DOM.querySelector
        - DOM.querySelectorAll
        - DOM.getOuterHTML
        - DOM.getBoxModel
        - Input.click
        - Input.dispatchMouseEvent
        - Input.dispatchKeyEvent
        - Input.insertText
        - Network.enable
        - Network.disable
        - AWCP.getSnapshot
        - AWCP.invoke
    params:
      type: object
      description: "JSON parameters for the selected method. For AWCP.getSnapshot omit params or pass {} for the action index; pass {action: <name>} for that action's full manual, schemas and examples. For AWCP.invoke pass exactly {revision, action, args}, using the revision from the manual and the website's documented business arguments. On errors, consult the manual and execution status; do not blindly repeat an operation with unknown side effects. For CDP it is mutually exclusive with paramsFile; omit both for no parameters. Use native JSON value types; for example Runtime.evaluate returnByValue and awaitPromise must be booleans true/false, not strings \"true\"/\"false\". For Input.dispatchMouseEvent, x/y must be JSON numbers (fractions are valid), clickCount must be an integer, and button is a string such as \"left\". Platform does not coerce strings to numbers or booleans. On invalid_args, fix every reported field before retrying; do not reload or close a page to fix parameter types. Use top-level surfaceId for Surface.close."
      additionalProperties: true
    paramsFile:
      type: string
      description: "CDP methods only. Optional path to a UTF-8 JSON file containing only the params object, not the full request. Mutually exclusive with params and rejected for AWCP methods. Relative paths resolve from the execution workspace; explicit roots such as @chat and authorized absolute paths follow the standard file read AccessPolicy and approval rules. The file must be regular and fit within file-tools.max-read-bytes (default 1 MiB); it is read in full without truncation. Platform sends its contents as params through the existing CDP request."
    surfaceId:
      type: string
      description: "Exact page instance returned by Surface.list or desktop.workpanel.openWeb. Required for page/CDP operations; omit for Surface.list and Surface.getCurrent. AWCP accepts it to select a page within the trusted Run application grant. Container and WorkPanel item identifiers cannot substitute for it."
    requestId:
      type: string
      description: "CDP methods only. Optional request id for audit/debug correlation. Omit for both AWCP methods; their request identity is generated by Platform."
  required:
    - method
  additionalProperties: false
