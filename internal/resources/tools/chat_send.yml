name: chat_send
i18n:
  en:
    label: "Send Mail"
  zh-CN:
    label: "寄信"
description: "Send a durable letter to an Agent Chat and receive the final result by mail. Read the task-control skill before use."
clientVisible: true
explicitOnly: true
readOnly: false
confirmationRules:
  - view: {key: chat_start_review}
inputSchema:
  type: object
  properties:
    message:
      type: string
      minLength: 1
      description: "Required. Task message."
    agentKey:
      type: string
      minLength: 1
      description: "Target Agent key. Optional; defaults to the current calling Agent."
    chatId:
      type: string
      minLength: 1
      description: "Existing Chat to continue."
    accessLevel:
      type: string
      enum:
        - default
        - auto_approve
        - full_access
      description: "Permission level for this run. Above the caller Run level requires human approval."
    references:
      type: array
      description: "Resources selected for this task. Each item must be used; no tools or unrelated permissions are added."
      items:
        type: object
        properties:
          type:
            type: string
            description: "Required. Resource kind."
            enum: [skill, kbase, chat]
          id:
            description: "Required. Exact resource ID."
            type: string
            minLength: 1
        required: [type, id]
        additionalProperties: false
    modelKey:
      type: string
      minLength: 1
      description: "Optional model override; defaults to the calling Run model. List keys with chat_query models."
    reasoningEffort:
      type: string
      enum:
        - NONE
        - LOW
        - MEDIUM
        - HIGH
        - XHIGH
        - MAX
      description: "Optional reasoning override; defaults to the calling Run effort, including NONE."
    chatName:
      type: string
      minLength: 1
      description: "Name for a new Chat."
    newChat:
      type: boolean
      description: "Open another task in a new Chat; exclusive with chatId. Enables model, permission and name overrides."
    files:
      type: array
      description: "Attachments from the current Chat. Accepted bytes are copied to the receiver."
      items:
        type: string
  required:
    - message
  additionalProperties: false
