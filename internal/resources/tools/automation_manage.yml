name: "automation_manage"
i18n:
  en:
    label: "Manage Automations"
  zh-CN:
    label: "管理自动化"
description: "Manage automation schedules and manual execution. Read the task-control skill before use."
clientVisible: true
explicitOnly: true
readOnly: false
operationAware: true
tags:
  - "platform"
  - "management"
confirmationRules:
  - when:
      /action: delete
    view: {key: automation_delete_review}
  - when:
      /action: trigger
    view: {key: automation_trigger_review}
  - view: {key: automation_review}
inputSchema:
  type: object
  properties:
    action:
      type: string
      enum:
        - "create"
        - "update"
        - "setEnabled"
        - "delete"
        - "trigger"
    args:
      type: object
      description: "See its skill."
      properties:
        enabled:
          type: boolean
          description: "Whether the automation is enabled."
        remainingRuns:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 100
          description: "Remaining scheduled executions; update with null to remove the limit."
        query:
          type: object
          description: "Saved query."
          properties:
            hidden:
              type: boolean
              description: "Query visibility flag."
  required:
    - "action"
  additionalProperties: false
