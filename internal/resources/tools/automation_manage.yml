name: "automation_manage"
i18n:
  en:
    label: "Manage Automations"
  zh-CN:
    label: "管理自动化"
description: "Manage automation schedules and manual execution. Read the task-control skill before use."
clientVisible: true
explicitOnly: true
readOnly: false
operationAware: true
tags:
  - "platform"
  - "management"
confirmationRules:
  - when:
      /action: delete
    viewportType: html
    viewportKey: automation_delete_review
  - when:
      /action: trigger
    viewportType: html
    viewportKey: automation_trigger_review
  - viewportType: html
    viewportKey: automation_review
inputSchema:
  type: object
  properties:
    action:
      type: string
      description: "Required. Exact action owned by this tool; see its mounted skill reference."
      enum:
        - "create"
        - "update"
        - "setEnabled"
        - "delete"
        - "trigger"
    args:
      type: object
      description: "Action-specific arguments; see the task-control skill's automation reference."
      properties:
        enabled:
          type: boolean
          description: "Whether the automation is enabled."
        remainingRuns:
          type: integer
          minimum: 1
          maximum: 100
          description: "Remaining scheduled executions."
        query:
          type: object
          description: "Saved query."
          properties:
            hidden:
              type: boolean
              description: "Query visibility flag."
  required:
    - "action"
  additionalProperties: false
