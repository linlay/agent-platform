name: plan_add_tasks
label: 创建任务
description: Create ordered plan tasks in init status, supporting multiple tasks in one call. Defaults to appending tasks to the current plan. Use mode=new only for a distinct new plan; this creates a new planId and makes the provided tasks the complete initial task list. Plan tasks run one at a time in array order. Success returns taskId | status | description lines.
clientVisible: true
inputSchema:
  type: object
  properties:
    mode:
      type: string
      enum:
        - append
        - new
      description: Optional. Defaults to append. Use new only when starting a distinct new plan; it creates a new planId and discards the previous plan tasks from the current plan state.
    tasks:
      type: array
      description: Required. Ordered list of tasks to create. Every new task starts in init status.
      items:
        type: object
        properties:
          description:
            type: string
            description: Required. Task description explaining the work that needs to be completed.
        required:
          - description
        additionalProperties: false
  required:
    - tasks
  additionalProperties: false
