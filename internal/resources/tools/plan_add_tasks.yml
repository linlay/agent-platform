name: plan_add_tasks
label: 创建任务
description: Optionally create an ordered task plan. Tasks must advance in list order and at most one task may be in_progress. Every new task starts in init; creation does not start any task or require an immediate update. Only the first non-terminal task may advance from init. Defaults to appending to the current plan. Use mode=new only for a distinct new plan, not to bypass a rejected update; it creates a new planId and makes the provided tasks the complete initial list. Success returns taskId | status | description lines.
clientVisible: true
inputSchema:
  type: object
  properties:
    mode:
      type: string
      enum:
        - append
        - new
      description: Optional. Defaults to append. Use new only when starting a distinct new plan; it creates a new planId and discards the previous plan tasks from the current plan state.
    tasks:
      type: array
      description: Required. Ordered list of optional progress items to create. Every new task starts in init and remains there until explicitly updated.
      items:
        type: object
        properties:
          description:
            type: string
            description: Required. Concise description of the work represented by this progress item.
        required:
          - description
        additionalProperties: false
  required:
    - tasks
  additionalProperties: false
