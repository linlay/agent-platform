name: desktop_action
label: 桌面端动作
description: Execute an allowlisted desktop action through the current run's trusted reverse connection. Before invoking, read the relevant installed skill and action reference for the selected operation. Action availability depends on the runtime and caller scope. Do not infer arguments from returned objects or other actions. On failure, preserve the original error and report the exact invalid field or path, failure stage, direct cause, and recovery guidance when supplied by structured diagnostics. Do not replace specific diagnostics with a generic failure summary or invent a missing cause. Inspect execution state before retrying. No fallback to local HTTP or another client window.
inputSchema:
  type: object
  properties:
    action:
      type: string
      description: |
        Required exact desktop.* action name, never a wildcard.
        Scope: desktop.navigate.*, desktop.assistant.*, desktop.general.*, desktop.runtime.*, desktop.theme.*, desktop.skin.*, desktop.locale.*, desktop.display, desktop.copilot.*, desktop.web.*, desktop.workpanel.*, desktop.site.*, desktop.website.*, desktop.webapp.*, desktop.controlCenter.*, desktop.market.*, desktop.help.*, desktop.agent.*, desktop.skill.*, desktop.kanban.*, desktop.pet.*.
        Read the desktop-action skill catalog and the relevant domain reference for exact action names and arguments.
        Domain prefixes describe scope only; Platform enforces a separate exact runtime allowlist.
    args:
      type: object
      description: JSON arguments for the selected action, as documented by its relevant skill and action contract. Accepted fields, path formats, and result semantics are action-specific. Platform supplies trusted execution context; callers must not override reserved source, ownership, transport, or confirmation fields.
      additionalProperties: true
    requestId:
      type: string
      description: Optional stable request id for audit/debug correlation. Leave blank to let the selected provider generate one.
  required:
    - action
  additionalProperties: false
