name: bash_sandbox
i18n:
  en:
    label: "Run Sandbox Command"
  zh-CN:
    label: "执行沙箱命令"
description: Execute a command inside the sandbox container. Runtime routes to this internal implementation when the agent declares runtimeConfig.environmentId. Uses the same run-authored script and opaque-entry policy as Host Bash, resolving executable identities and verifying mapped script bytes inside the actual container. Failed resolution is conservatively reviewed; host files do not prove container /tmp contents. Optionally include a short Chinese description explaining the command purpose.
inputSchema:
  type: object
  properties:
    command:
      type: string
      description: Required. Command string to execute inside the sandbox container via /bin/sh -lc.
    description:
      type: string
      description: Optional. A short Chinese sentence describing the command purpose, shown during human approval. Defaults to a command summary when omitted.
    cwd:
      type: string
      description: Working directory for this execution. When empty, the current run's default sandbox cwd is used.
    timeout:
      type: integer
      description: Execution timeout in seconds.
    env:
      type: array
      description: Additional environment variables for this command, merged over the session defaults.
      items:
        type: object
        properties:
          name:
            type: string
            description: Required. Environment variable name.
          value:
            type: string
            description: Required. Environment variable value. An empty value is allowed.
        required:
          - name
          - value
        additionalProperties: false
  required:
    - command
  additionalProperties: false
