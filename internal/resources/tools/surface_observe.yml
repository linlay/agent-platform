name: surface_observe
i18n:
  en:
    label: "Observe Page"
  zh-CN:
    label: "观察网页"
description: "Read a webpage's semantic snapshot and element references for the next interaction. Read the web-control skill before use."
clientVisible: true
readOnly: true
inputSchema:
  type: object
  properties:
    surfaceId:
      type: string
      description: "Required. Webpage identity."
    maxTextLength:
      type: integer
      minimum: 1
      maximum: 30000
      description: "Optional semantic text limit."
    maxElements:
      type: integer
      minimum: 1
      maximum: 500
      description: "Optional element count limit."
    viewportOnly:
      type: boolean
      description: "Observe only content in the current viewport."
  required:
    - surfaceId
  additionalProperties: false
