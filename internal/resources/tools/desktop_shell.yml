name: "desktop_shell"
label: "桌面控制"
i18n:
  en:
    label: "Desktop Control"
  zh-CN:
    label: "桌面控制"
description: "desktop_shell: navigate.toRoute, help.openTopic, agent.open, skill.open, assistant.chat, display, runtime.info, runtime.diagnostics, general.deviceName. Call with action and args. Desktop validates action arguments. Read the platform-control skill domain reference. Page control belongs to web-control."
clientVisible: true
explicitOnly: true
readOnly: false
operationAware: true
tags:
  - "platform"
  - "management"
inputSchema:
  type: "object"
  properties:
    action:
      description: "Required. Exact action owned by this tool; see its mounted skill reference."
      type: "string"
      enum:
        - "navigate.toRoute"
        - "help.openTopic"
        - "agent.open"
        - "skill.open"
        - "assistant.chat"
        - "display"
        - "runtime.info"
        - "runtime.diagnostics"
        - "general.deviceName"
    args:
      type: "object"
      description: "Optional. Action-specific arguments; see the mounted platform-control skill."
  required:
    - "action"
  additionalProperties: false
