name: "desktop_shell"
i18n:
  en:
    label: "Desktop Control"
  zh-CN:
    label: "桌面控制"
description: "Control Desktop navigation and shell utilities. Read the platform-control skill before use."
clientVisible: true
explicitOnly: true
readOnly: false
operationAware: true
tags:
  - "platform"
  - "management"
confirmationRules:
  - when:
      /action: runtime.diagnostics
    viewportType: html
    viewportKey: desktop_diagnostics_review
inputSchema:
  type: "object"
  properties:
    action:
      type: "string"
      enum:
        - "navigate.toRoute"
        - "help.openTopic"
        - "agent.open"
        - "skill.open"
        - "assistant.chat"
        - "display"
        - "runtime.info"
        - "runtime.diagnostics"
        - "general.deviceName"
    args:
      type: "object"
      description: "See its skill."
  required:
    - "action"
  additionalProperties: false
