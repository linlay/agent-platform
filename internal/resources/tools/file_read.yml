name: file_read
i18n:
  en:
    label: "Read File"
  zh-CN:
    label: "读取文件"
description: |
  Read a single file from the host filesystem. Use this before editing or inspecting file contents; this tool is read-only and does not require approval. PNG/JPEG/WebP/GIF images return base64 image payloads, known binary/device files are rejected, and repeating the same read of an unchanged file in the same run may return kind=unchanged.
  Text is returned in pages of whole lines that fit the model output budget. The result reports totalLines, startLine, endLine and hasMore; when hasMore is true, call again with offset=nextOffset to continue. A single line larger than the budget is cut and reported as longLineTruncated.
  Pages of the same file version accumulate: file_edit requires the lines it changes to have been read, and file_write over an existing file requires every line to have been read.
inputSchema:
  type: object
  properties:
    filePath:
      type: string
      description: Required. Absolute path, an explicit semantic-root path (@workspace, @chat, @agent, @skills, @skills-center, @connectors/<id>, @owner, @runtime, or @temp), or a path relative to the current Workspace. For installed skills, copy the skill catalog's path value verbatim into this field; @connectors/<id>/skills/.../SKILL.md is accepted directly and must not be rewritten to @skills or another root.
    offset:
      type: integer
      description: One-based line number to start reading from. Defaults to the beginning of the file.
    limit:
      type: integer
      description: Maximum number of lines to return. A page may stop earlier at the output budget; follow nextOffset when hasMore is true.
    addLineNumbers:
      type: boolean
      default: false
      description: Add cat -n style line numbers to UTF-8 text output. Defaults to false.
    encoding:
      type: string
      description: Optional. Decode text with a specific file encoding. Supported explicit values are utf-8 and gb18030/gbk. Automatic detection covers utf-8, gb18030/gbk, and the current Windows ACP.
  required:
    - filePath
  additionalProperties: false
