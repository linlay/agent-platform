name: kbase_refresh
i18n:
  en:
    label: "Refresh Knowledge Base"
  zh-CN:
    label: "刷新知识库"
description: Schedule asynchronous KBX source reconciliation for the current Agent. Returns a durable refreshId; wait for kbase.refreshTerminal and inspect kbase_status before retrying retrieval.
clientVisible: true
readOnly: false
inputSchema:
  type: object
  properties:
    force:
      type: boolean
      description: Fully reconcile source files and explicitly rebuild all vectors for the current model contract. Use only for an authorized rebuild.
      default: false
  additionalProperties: false
