name: kbase_refresh
i18n:
  en:
    label: "Refresh Knowledge Base"
  zh-CN:
    label: "刷新知识库"
description: Request KBX maintenance for the current Agent. Returns unavailable until the singleton update/reconnect protocol is supported; it never falls back to the retired index engine.
clientVisible: true
readOnly: false
inputSchema:
  type: object
  properties:
    force:
      type: boolean
      description: Rebuild the index even when file metadata appears unchanged.
      default: false
  additionalProperties: false
