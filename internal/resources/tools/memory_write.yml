name: memory_write
i18n:
  en:
    label: "Manage Memory"
  zh-CN:
    label: "维护记忆"
description: Save or delete personal Markdown, or append a daily note. Only ordinary native main runs may write. Read first and supply revision. Never store credentials or unverified assumptions.
clientVisible: false
inputSchema:
  type: object
  additionalProperties: false
  properties:
    kind:
      description: Required. Personal profile, long-term memory, or a dated note.
      type: string
      enum:
        - owner
        - memory
        - summary
        - daily
    date:
      type: string
      description: Optional. Daily date YYYY-MM-DD, defaults to today.
    operation:
      description: Required. Replace content, append to a daily note, or delete the document.
      type: string
      enum:
        - save
        - append
        - delete
    content:
      type: string
      description: Optional. Omit only for delete; required for save (full Markdown) and append (new daily text). OWNER changes require explicit user instruction.
    revision:
      type: string
      description: Required. Exact revision from memory_read, including missing for a new file. Re-read and reconcile on conflict.
  required:
    - kind
    - operation
    - revision
