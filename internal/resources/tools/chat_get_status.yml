name: chat_get_status
i18n:
  en:
    label: "Get Chat Run Status"
  zh-CN:
    label: "查询会话运行状态"
description: "Read the status and result of an independent run started by chat_start. Read the task-control skill before use."
clientVisible: true
explicitOnly: true
readOnly: true
inputSchema:
  type: object
  properties:
    runId:
      type: string
      minLength: 1
      description: "Required. Run ID returned by chat_start."
  required:
    - runId
  additionalProperties: false
