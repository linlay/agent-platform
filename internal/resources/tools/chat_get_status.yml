name: chat_get_status
i18n:
  en:
    label: "Get Chat Run Status"
  zh-CN:
    label: "查询会话运行状态"
description: "Read mail status or the result of an owned independent run. Read the task-control skill before use."
clientVisible: true
explicitOnly: true
readOnly: true
inputSchema:
  type: object
  properties:
    runId:
      type: string
      minLength: 1
      description: "Owned Run ID; mutually exclusive with mailId."
    mailId:
      type: string
      minLength: 1
      description: "Mail ID. Mutually exclusive with runId. Inserted letters expose mail status only."
  additionalProperties: false
