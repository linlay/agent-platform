name: surface_evaluate
i18n:
  en:
    label: "Run Page Script"
  zh-CN:
    label: "网页执行脚本"
description: "Evaluate JavaScript in a webpage. Read the web-control skill before use."
clientVisible: true
inputSchema:
  type: object
  properties:
    surfaceId:
      type: string
      description: "Required. Webpage identity."
    expression:
      type: string
      description: "JavaScript expression."
    expressionFile:
      type: string
      description: "JavaScript file path."
    awaitPromise:
      type: boolean
      description: "Wait for a returned Promise."
  required:
    - surfaceId
  additionalProperties: false
