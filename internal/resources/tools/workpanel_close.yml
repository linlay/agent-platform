name: workpanel_close
i18n:
  en:
    label: "Close WorkPanel"
  zh-CN:
    label: "工作面板关闭"
description: "Close a file preview or the whole WorkPanel. Read the web-control skill before use."
clientVisible: true
inputSchema:
  type: object
  properties:
    url:
      type: string
      description: "File preview path."
    all:
      type: boolean
      description: "Close the whole WorkPanel."
  additionalProperties: false
