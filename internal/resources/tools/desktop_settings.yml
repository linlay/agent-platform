name: "desktop_settings"
i18n:
  en:
    label: "Desktop Settings"
  zh-CN:
    label: "桌面设置"
description: "Manage Desktop appearance and preferences. Read the platform-control skill before use."
clientVisible: true
explicitOnly: true
readOnly: false
operationAware: true
tags:
  - "platform"
  - "management"
confirmationRules:
  - when:
      /action: theme.set
    view: {key: desktop_appearance_review}
  - when:
      /action: locale.set
    view: {key: desktop_appearance_review}
  - when:
      /action: skin.import
    view: {key: desktop_appearance_review}
  - when:
      /action: skin.set
    view: {key: desktop_appearance_review}
  - when:
      /action: skin.remove
    view: {key: desktop_appearance_review}
  - when:
      /action: pet.show
    view: {key: desktop_appearance_review}
  - when:
      /action: pet.hide
    view: {key: desktop_appearance_review}
  - when:
      /action: pet.import
    view: {key: desktop_appearance_review}
  - when:
      /action: pet.set
    view: {key: desktop_appearance_review}
  - when:
      /action: copilot.setPagePreference
    view: {key: desktop_appearance_review}
inputSchema:
  type: "object"
  properties:
    action:
      type: "string"
      enum:
        - "theme.get"
        - "theme.set"
        - "locale.get"
        - "locale.set"
        - "skin.get"
        - "skin.list"
        - "skin.import"
        - "skin.set"
        - "skin.remove"
        - "pet.state"
        - "pet.list"
        - "pet.show"
        - "pet.hide"
        - "pet.set"
        - "pet.import"
        - "copilot.getPagePreferences"
        - "copilot.setPagePreference"
    args:
      type: "object"
      description: "See its skill."
  required:
    - "action"
  additionalProperties: false
