name: kbase_search
i18n:
  en:
    label: "Search Knowledge Base"
  zh-CN:
    label: "搜索知识库"
activityArgs: [query]
description: "Search a knowledge library by hybrid, full-text, vector or graph retrieval. Read the kbase-control skill before use."
tags: [knowledge-base, search]
clientVisible: true
readOnly: true
inputSchema:
  type: object
  properties:
    libraryId:
      type: string
      minLength: 1
      description: "Required. Knowledge library ID."
    query:
      type: string
      description: "Required. Search query."
    method:
      type: string
      enum:
        - query
        - search
        - vsearch
        - gsearch
      default: query
      description: "Retrieval method."
    collections:
      type: array
      minItems: 1
      items:
        type: string
        minLength: 1
      description: "Collections to search."
    rerank:
      type: boolean
      description: "Override the rerank setting."
    queryExpansion:
      type: boolean
      description: "Override the query expansion setting."
    limit:
      type: integer
      minimum: 1
      maximum: 50
      description: "Maximum chunks to return."
    candidateLimit:
      type: integer
      minimum: 1
      maximum: 2000
      description: "Candidate budget."
    exclude:
      type: array
      items:
        type: string
        minLength: 1
      description: "Lexical expressions that exclude matching documents."
    intent:
      type: string
      description: "Positive context hint."
    minScore:
      type: number
      description: "Minimum ranking score."
    filter:
      type: string
      description: "KBX filter expression or JSON string."
    recencyWeight:
      type: number
      minimum: 0
      maximum: 1
      description: "Freshness weight."
    recencyHalfLifeDays:
      type: number
      exclusiveMinimum: 0
      description: "Freshness half-life in days."
    noGraph:
      type: boolean
      description: "Disable graph recall."
    entities:
      type: array
      items:
        type: string
        minLength: 1
      description: "Graph entity keys or exact names."
    relations:
      type: array
      items:
        type: string
        minLength: 1
      description: "Allowed graph predicate IDs."
    direction:
      type: string
      enum:
        - auto
        - out
        - in
        - both
      description: "Relationship direction."
    maxHops:
      type: integer
      minimum: 1
      maximum: 3
      description: "Maximum relationship hops."
    pathPrefix:
      type: string
      description: "Collection-prefixed directory prefix."
    pathGlob:
      type: string
      description: "Glob over collection/relativePath."
    type:
      type: string
      description: "File extension filter."
  required:
    - libraryId
    - query
  additionalProperties: false
