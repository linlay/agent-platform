name: kbase_search
i18n:
  en:
    label: "Search Knowledge Base"
  zh-CN:
    label: "搜索知识库"
description: Search the current Agent KBX knowledge base. The limit counts chunks, including multiple chunks from one document. Filters apply before recall; offset is unavailable.
tags: [knowledge-base, search]
clientVisible: true
readOnly: true
inputSchema:
  type: object
  properties:
    query:
      type: string
      description: Required. Search query.
    limit:
      type: integer
      description: Maximum number of chunks to return. Defaults to the agent retrieval topK.
    pathPrefix:
      type: string
      description: Workspace-relative directory prefix applied before recall, such as docs/. Matching is case-sensitive and respects directory boundaries.
    pathGlob:
      type: string
      description: KBX glob matched against workspace-relative indexed paths. Supports *, ?, and **.
    type:
      type: string
      description: Case-insensitive final file extension filter such as md or .pdf, applied before recall.
  required:
    - query
  additionalProperties: false
