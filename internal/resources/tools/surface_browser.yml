name: surface_browser
i18n:
  en:
    label: "Choose Task Browser"
  zh-CN:
    label: "选择任务浏览器"
description: "Select Chrome before page work when the user asks for it; otherwise the task uses the WorkPanel. Read the web-control skill before use."
clientVisible: true
readOnly: true
inputSchema:
  type: object
  properties:
    browser:
      type: string
      enum:
        - chrome
        - workpanel
      description: "Required. chrome when the user asked for Chrome; workpanel only states the default explicitly."
  required:
    - browser
  additionalProperties: false
