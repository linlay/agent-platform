name: image_generate
label: 图像生成
description: |
  Generate images through the globally configured image generation model. Use
  this when the user explicitly asks to create or render an image. Every
  successful images[] item contains an internal path and a user-visible url.
  path may be an absolute host path and is only for passing to another tool;
  never show it, mention it, or put it in Markdown. To display a generated
  image, copy the exact images[n].url into Markdown, for example
  ![description](image.png). The returned url is relative to the current Chat;
  it never contains chatId or the internal /api/resource transport endpoint.
  Never construct or encode a resource URL, and never output the returned
  path, file://, @chat, /chat, or chat_dir. If an image has no valid url, do
  not fabricate image Markdown; tell the user that image materialization
  failed.
explicitOnly: true
inputSchema:
  type: object
  properties:
    prompt:
      type: string
      description: Required. Text prompt describing the image to generate.
    profile:
      type: string
      description: Optional. Profile name from configs/ai-tools.yml > image-generate. Defaults to default-profile.
    size:
      type: string
      description: Optional. Image size to send to the provider, overriding the selected profile.
    response_format:
      type: string
      description: Optional. Provider response format, overriding the selected profile.
      enum:
        - b64_json
        - url
    n:
      type: integer
      description: Optional. Number of images to generate. Defaults to 1.
      minimum: 1
      maximum: 4
  required:
    - prompt
  additionalProperties: false
