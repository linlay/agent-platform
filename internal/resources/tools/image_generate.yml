name: image_generate
label: 图像生成
description: |
  Generate or edit images through the globally configured image model. Use
  this when the user explicitly asks to create, transform, or inpaint an image.
  Without images this performs text-to-image generation. With images, images[0]
  is the edit target and later items are references. An optional mask applies
  only to images[0]. Every
  successful images[] item contains an internal path and a user-visible url.
  path may be an absolute host path and is only for passing to another tool;
  never show it, mention it, or put it in Markdown. To display a generated
  image, copy the exact images[n].url into Markdown, for example
  ![description](image.png). The returned url is relative to the current Chat;
  it never contains chatId or the internal /api/resource transport endpoint.
  Never construct or encode a resource URL, and never output the returned
  path, file://, @chat, /chat, or chat_dir. If an image has no valid url, do
  not fabricate image Markdown; tell the user that image materialization
  failed.
explicitOnly: true
inputSchema:
  type: object
  properties:
    prompt:
      type: string
      description: Required. Text prompt describing the image to generate or the requested edit.
    images:
      type: array
      description: Optional. One to four input images. images[0] is the edit target; later images are references. Use {"source_type":"reference_name","value":"image.png"} for a current-chat attachment or {"source_type":"file_path","value":"@chat/image.png"} for an access-policy-checked path.
      minItems: 1
      maxItems: 4
      items:
        type: object
        properties:
          source_type:
            type: string
            description: Required. How value is resolved.
            enum:
              - reference_name
              - file_path
          value:
            type: string
            minLength: 1
            description: Required. Current-chat attachment name when source_type is reference_name; otherwise an explicit image path. Semantic roots such as @chat, @agent, and @skills are supported for file_path and checked by access policy.
        required:
          - source_type
          - value
        additionalProperties: false
    mask:
      type: object
      description: Optional inpainting mask for images[0]. Requires images and a model whose YAML declares native mask support.
      properties:
        source_type:
          type: string
          description: Required. How value is resolved.
          enum:
            - reference_name
            - file_path
        value:
          type: string
          minLength: 1
          description: Required. Current-chat attachment name when source_type is reference_name; otherwise an explicit mask path checked by access policy.
        mode:
          type: string
          description: Required. Mask interpretation. alpha edits transparent pixels; white_edit edits white pixels; black_edit edits black pixels.
          enum:
            - alpha
            - white_edit
            - black_edit
      required:
        - source_type
        - value
        - mode
      additionalProperties: false
    profile:
      type: string
      description: Optional. Profile name from configs/ai-tools.yml > image-generate. Omit it to use the configured default profile. Available values are injected at startup.
    size:
      type: string
      description: Optional. Image size to send to the provider, overriding the selected profile.
    response_format:
      type: string
      description: Optional. Provider response format, overriding the selected profile.
      enum:
        - b64_json
        - url
    n:
      type: integer
      description: Optional. Number of images to generate. Defaults to 1.
      minimum: 1
      maximum: 4
  required:
    - prompt
  additionalProperties: false
