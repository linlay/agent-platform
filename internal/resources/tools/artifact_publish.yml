name: artifact_publish
label: 发布产物
description: |
  Publish files as user-visible artifacts for the current run. You MUST call
  this tool whenever a requested deliverable file exists. Sources must be
  inside the current Workspace or Chat: use /workspace/... or /chat/... in
  Container Hub, @workspace/@chat aliases, host paths inside those roots, or
  Workspace-relative paths. Published copies are always stored under the
  current Chat artifacts directory. Arbitrary user-local absolute paths such
  as /Users/.../Downloads must first be uploaded, imported, or copied into a
  controlled root. The batch succeeds only when every item is published;
  trust the returned publishedArtifacts list as the publication result.
clientVisible: true
inputSchema:
  type: object
  properties:
    artifacts:
      type: array
      description: Required. List of artifacts to publish. Must not be empty.
      minItems: 1
      items:
        type: object
        properties:
          path:
            type: string
            description: Required. Existing file in the current Workspace or Chat. The source basename becomes the download filename; republishing it in the same run overwrites the prior published copy.
          description:
            type: string
            description: Short description of this artifact.
        required:
          - path
        additionalProperties: false
  required:
    - artifacts
  additionalProperties: false
