name: memory_search
i18n:
  en:
    label: "Search Memory"
  zh-CN:
    label: "查找记忆"
description: List daily notes or search personal Markdown text. Knowledge indexing belongs to KBX.
clientVisible: false
inputSchema:
  type: object
  additionalProperties: false
  properties:
    query:
      type: string
      description: Optional. Literal text to find. Omit to list daily dates.
    before:
      type: string
      description: Optional. Exclusive date cursor YYYY-MM-DD. Searches up to 200 daily files and returns the first matching line from up to 40 files. Continue with nextBefore.
  required: []
