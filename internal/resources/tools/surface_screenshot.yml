name: surface_screenshot
i18n:
  en:
    label: "Capture Page"
  zh-CN:
    label: "网页截图"
description: "Capture a page image. Slow; only for visual questions, never to verify actions. Read the web-control skill before use."
clientVisible: true
readOnly: true
inputSchema:
  type: object
  properties:
    surfaceId:
      type: string
      description: "Required. Page surfaceId."
    fullPage:
      type: boolean
      description: "Capture the whole page."
  required:
    - surfaceId
  additionalProperties: false
