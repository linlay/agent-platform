name: "catalog_query"
i18n:
  en:
    label: "Query Catalog"
  zh-CN:
    label: "查询目录"
description: "Discover Platform resources and validate definition candidates. Read the platform-control skill before use."
clientVisible: true
explicitOnly: true
readOnly: true
operationAware: true
tags:
  - "platform"
  - "management"
inputSchema:
  type: "object"
  properties:
    action:
      description: "Required. Exact action owned by this tool; see its mounted skill reference."
      type: "string"
      enum:
        - "resourceTypes"
        - "list"
        - "get"
        - "defaults"
        - "validate"
    args:
      type: "object"
      description: "Action-specific arguments; see the platform-control skill's catalog reference."
  required:
    - "action"
  additionalProperties: false
