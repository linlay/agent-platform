name: agent_invoke
label: 调度智能体
description: |
  Dispatch 1 to 5 other sub-agents in parallel, stream each sub-agent's
  activity live, and continue after all final answers are returned as one
  aggregated tool result. Never target the current Agent Identity.key.
clientVisible: true
inputSchema:
  type: object
  properties:
    tasks:
      type: array
      description: Required. Up to 5 sub-agent tasks to execute in parallel.
      minItems: 1
      maxItems: 5
      items:
        type: object
        properties:
          subAgentKey:
            type: string
            description: Required. Exact catalog key of a different sub-agent to run. It must not equal the current Agent Identity.key.
          task:
            type: string
            description: Required. The exact task prompt to send to the sub-agent.
          taskName:
            type: string
            description: Optional. Short title shown in the task panel while the sub-agent is active.
          files:
            type: array
            description: Optional. Local files the sub-agent must inspect. Cross-agent files are materialized through the current Chat; PROXY/CHANNEL adapters receive ticketed resource URLs.
            items:
              type: string
            maxItems: 10
        required:
          - subAgentKey
          - task
        additionalProperties: false
  required:
    - tasks
  additionalProperties: false
