name: "desktop_webapp"
i18n:
  en:
    label: "Desktop Web Apps"
  zh-CN:
    label: "桌面网页应用"
description: "Manage Desktop WebApp lifecycle and distribution. Read the platform-control skill before use."
clientVisible: true
explicitOnly: true
readOnly: false
operationAware: true
tags:
  - "platform"
  - "management"
confirmationRules:
  - when:
      /action: webapp.start
    viewportType: html
    viewportKey: desktop_webapp_review
  - when:
      /action: webapp.stop
    viewportType: html
    viewportKey: desktop_webapp_review
  - when:
      /action: webapp.restart
    viewportType: html
    viewportKey: desktop_webapp_review
  - when:
      /action: webapp.open
    viewportType: html
    viewportKey: desktop_webapp_review
  - when:
      /action: webapp.updatePreferences
    viewportType: html
    viewportKey: desktop_webapp_review
  - when:
      /action: webapp.unpublish
    viewportType: html
    viewportKey: desktop_webapp_review
  - when:
      /action: web.exportArtifact
    viewportType: html
    viewportKey: desktop_export_review
inputSchema:
  type: "object"
  properties:
    action:
      description: "Required. Exact action owned by this tool; see its mounted skill reference."
      type: "string"
      enum:
        - "webapp.getStatus"
        - "webapp.checkRuntime"
        - "webapp.getPublishStatus"
        - "webapp.start"
        - "webapp.stop"
        - "webapp.restart"
        - "webapp.open"
        - "webapp.updatePreferences"
        - "webapp.package.init"
        - "webapp.package.validate"
        - "webapp.package.build"
        - "webapp.install"
        - "webapp.uninstall"
        - "webapp.publish"
        - "webapp.unpublish"
        - "web.exportArtifact"
    args:
      type: "object"
      description: "Action-specific arguments; see the platform-control skill's webapp reference."
  required:
    - "action"
  additionalProperties: false
