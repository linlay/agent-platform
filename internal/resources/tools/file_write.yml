name: file_write
i18n:
  en:
    label: "Write File"
  zh-CN:
    label: "写入文件"
description: |
  Create or overwrite a single text file on the host filesystem. Prefer this tool for creating files, writing scripts, or replacing complete file contents when available.
  A script written to @chat with this tool runs without execution approval while unchanged, in this run only; write one-off scripts there.
  Do not use bash redirection, heredocs, cat/echo/printf/tee, or interpreter one-liners to write files when this tool is available.
  Existing files must be fully read in the same run before writing; external changes after read return file_modified_since_read. Successful results include lineStats with addedLines, deletedLines, and editedLines.
  When encoding is omitted, existing text files keep their detected encoding when it is UTF-8, gb18030/gbk, or the current Windows ACP; new files default to UTF-8.
inputSchema:
  type: object
  properties:
    filePath:
      type: string
      description: Required. Absolute path, an explicit @workspace/@chat/@agent/@skills/@skills-center/@owner/@temp path, or a path relative to the current Workspace.
    content:
      type: string
      description: Required. Complete text contents to write. Existing file contents are replaced.
    encoding:
      type: string
      description: Optional. Target file encoding. Supported explicit values are utf-8 and gb18030/gbk. When omitted, existing text files keep their detected encoding when it is utf-8, gb18030/gbk, or the current Windows ACP; new files default to utf-8.
    description:
      type: string
      description: Optional. A short Chinese sentence describing the file write purpose, shown during human approval.
  required:
    - filePath
    - content
  additionalProperties: false
