name: workpanel_open
i18n:
  en:
    label: "Open WorkPanel"
  zh-CN:
    label: "工作面板打开"
description: "Open a webpage or file preview in the current Chat's WorkPanel. Read the web-control skill before use."
clientVisible: true
inputSchema:
  type: object
  properties:
    url:
      type: string
      description: "Required. Webpage address or file preview path."
    title:
      type: string
      description: "Tab title for a file preview."
    reload:
      type: boolean
      description: "Reload after opening."
  required:
    - url
  additionalProperties: false
