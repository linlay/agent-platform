name: "desktop_site"
i18n:
  en:
    label: "Desktop Websites"
  zh-CN:
    label: "桌面站点"
description: "Discover Desktop websites and WebApps, manage website entries and navigation pins. Read the platform-control skill before use."
clientVisible: true
explicitOnly: true
readOnly: false
operationAware: true
tags:
  - "platform"
  - "management"
confirmationRules:
  - when:
      /action: site.setPinned
    view: {key: desktop_website_review}
  - when:
      /action: website.add
    view: {key: desktop_website_review}
  - when:
      /action: website.update
    view: {key: desktop_website_review}
  - when:
      /action: website.remove
    view: {key: desktop_website_review}
inputSchema:
  type: "object"
  properties:
    action:
      type: "string"
      enum:
        - "site.list"
        - "site.setPinned"
        - "website.list"
        - "website.add"
        - "website.update"
        - "website.remove"
        - "website.open"
    args:
      type: "object"
      description: "See its skill."
  required:
    - "action"
  additionalProperties: false
