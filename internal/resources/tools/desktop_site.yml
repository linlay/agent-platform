name: "desktop_site"
i18n:
  en:
    label: "Desktop Websites"
  zh-CN:
    label: "桌面网站"
description: "Manage and open Desktop websites. Read the platform-control skill before use."
clientVisible: true
explicitOnly: true
readOnly: false
operationAware: true
tags:
  - "platform"
  - "management"
confirmationRules:
  - when:
      /action: website.add
    viewportType: html
    viewportKey: desktop_website_review
  - when:
      /action: website.update
    viewportType: html
    viewportKey: desktop_website_review
  - when:
      /action: website.remove
    viewportType: html
    viewportKey: desktop_website_review
inputSchema:
  type: "object"
  properties:
    action:
      type: "string"
      enum:
        - "site.list"
        - "website.list"
        - "website.add"
        - "website.update"
        - "website.remove"
        - "website.open"
    args:
      type: "object"
      description: "See its skill."
  required:
    - "action"
  additionalProperties: false
