name: surface_cdp
i18n:
  en:
    label: "Page CDP"
  zh-CN:
    label: "网页CDP"
description: "Send one Chrome DevTools Protocol method to a webpage. Read the web-control skill before use."
clientVisible: true
inputSchema:
  type: object
  properties:
    surfaceId:
      type: string
      description: "Required. Webpage identity."
    method:
      type: string
      description: "Required. Protocol method."
      enum:
        - Page.enable
        - DOM.getDocument
        - DOM.querySelector
        - DOM.querySelectorAll
        - DOM.getOuterHTML
        - DOM.getBoxModel
        - Input.dispatchMouseEvent
        - Input.dispatchKeyEvent
        - Input.insertText
        - Network.enable
        - Network.disable
    params:
      type: object
      description: "Method parameters."
      additionalProperties: true
    paramsFile:
      type: string
      description: "JSON file path for the parameters."
  required:
    - surfaceId
    - method
  additionalProperties: false
