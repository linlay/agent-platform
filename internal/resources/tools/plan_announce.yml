name: plan_announce
i18n:
  en:
    label: "Announce Next Steps"
  zh-CN:
    label: "行动公示"
activityAnnounce: message
description: Tell the user, in one short sentence, what you are about to do next. The sentence is shown as the Run's progress line in place of individual tool calls and reasoning. Announce before starting multi-step work and again when you finish a group of related steps, change direction, or move to a new phase; do not announce for simple questions or before every single tool call. Call it in the same response as the tool calls it describes, listed first, rather than on its own. Describe the intended actions and any confirmed findings that motivate them, in the user's language; do not reveal internal reasoning. Use this instead of narrating next steps in reply text. It does not change plan tasks and does not wait for the user.
clientVisible: true
inputSchema:
  type: object
  properties:
    message:
      type: string
      minLength: 1
      maxLength: 120
      description: Required. One sentence about what you will do next, at most 120 characters.
  required:
    - message
  additionalProperties: false
