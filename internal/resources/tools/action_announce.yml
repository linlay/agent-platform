name: action_announce
i18n:
  en:
    label: "Announce Next Steps"
  zh-CN:
    label: "行动公示"
activityAnnounce: message
description: Tell the user, in one short sentence, what you are about to do next. The user often cannot see your tool calls or reasoning; this sentence is the only progress they see, so without it they are left waiting with no feedback. Call it at the start of every turn that needs tools, as the first tool call in the same response as the tool calls it describes, not on its own. Call it again whenever you move to a new phase, change direction, or finish a group of related steps. Skip it only when you answer directly without calling any other tool. State concretely what you will do and what it acts on, plus any confirmed findings that motivate it, in the user's language; do not reveal internal reasoning. Use this instead of narrating next steps in reply text. It does not change plan tasks and does not wait for the user.
clientVisible: false
inputSchema:
  type: object
  properties:
    message:
      type: string
      minLength: 1
      maxLength: 120
      description: Required. One sentence about what you will do next, at most 120 characters.
  required:
    - message
  additionalProperties: false
