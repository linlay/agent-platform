name: run_interrupt
label: 中断独立运行
description: Interrupt an independent run previously created by run_query for this caller and subject. Do not use this tool for the current run or for agent_invoke or agent_delegate child tasks.
clientVisible: true
explicitOnly: true
readOnly: false
inputSchema:
  type: object
  properties:
    runId:
      type: string
      minLength: 1
      description: Required. Run ID returned by run_query.
    message:
      type: string
      description: Optional. Reason or detail to attach to the interrupt request.
  required:
    - runId
  additionalProperties: false
