name: chat_start
i18n:
  en:
    label: "Start Chat Run"
  zh-CN:
    label: "发起会话运行"
description: "Start an independent Agent run. Only message is required. Prefer chat_send for durable correspondence. Read the task-control skill before use."
clientVisible: true
explicitOnly: true
readOnly: false
confirmationRules:
  - view: {key: chat_start_review}
inputSchema:
  type: object
  properties:
    message:
      type: string
      minLength: 1
      description: "Required. Task message."
    agentKey:
      type: string
      minLength: 1
      description: "Target Agent key. Optional; defaults to the current calling Agent."
    chatId:
      type: string
      minLength: 1
      description: "Existing Chat to continue."
    accessLevel:
      type: string
      enum:
        - default
        - ask_for_approval
        - auto_approve
        - full_access
      description: "Default/omit uses target default; concrete levels cannot exceed caller."
    references:
      type: array
      description: "Resources selected for this task. Each item must be used; no tools or unrelated permissions are added."
      items:
        type: object
        properties:
          type:
            type: string
            description: "Required. Resource kind."
            enum: [skill, kbase, chat]
          id:
            description: "Required. Exact resource ID."
            type: string
            minLength: 1
        required: [type, id]
        additionalProperties: false
    modelKey:
      type: string
      minLength: 1
      description: "Optional model override; defaults to the calling Run model. List keys with chat_query models."
    reasoningEffort:
      type: string
      enum:
        - NONE
        - LOW
        - MEDIUM
        - HIGH
        - XHIGH
        - MAX
      description: "Optional reasoning override; defaults to the calling Run effort, including NONE."
    chatName:
      type: string
      minLength: 1
      description: "Name for a new Chat."
  required:
    - message
  additionalProperties: false
