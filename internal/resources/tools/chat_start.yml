name: chat_start
i18n:
  en:
    label: "Start Chat Run"
  zh-CN:
    label: "发起会话运行"
description: "Start an independent Agent run in a new or existing Chat. Omit agentKey to use the current calling Agent. Read the task-control skill before use."
clientVisible: true
explicitOnly: true
readOnly: false
confirmationRules:
  - view: {key: chat_start_review}
inputSchema:
  type: object
  properties:
    message:
      type: string
      minLength: 1
      description: "Required. Task message."
    agentKey:
      type: string
      minLength: 1
      description: "Target Agent key. Optional; defaults to the current calling Agent."
    chatId:
      type: string
      minLength: 1
      description: "Existing Chat to continue."
    accessLevel:
      type: string
      enum:
        - default
        - auto_approve
        - full_access
      description: "Permission level for this run. Above the caller Run level requires human approval."
    mustUseSkills:
      type: array
      items:
        type: string
        minLength: 1
      description: "Required skill IDs."
    modelKey:
      type: string
      minLength: 1
      description: "Registered model key for this run. List keys with chat_query models."
    reasoningEffort:
      type: string
      enum:
        - NONE
        - LOW
        - MEDIUM
        - HIGH
        - XHIGH
        - MAX
      description: "Reasoning effort for this run."
    chatName:
      type: string
      minLength: 1
      description: "Name for a new Chat."
  required:
    - message
  additionalProperties: false
