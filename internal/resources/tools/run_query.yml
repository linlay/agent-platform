name: run_query
label: 发起独立运行
description: |
  Start an independent root run for exactly one catalog Agent or Team. By
  default, it creates a new Chat/thread; when chatId is provided, it continues
  that target-owned Chat instead. Return its chatId and runId immediately. This
  tool does not wait for the target result, and the target continues if the
  caller run is interrupted. When targeting the current Agent, set agentKey to
  the exact Agent Identity.key from the current system prompt. Chinese phrases
  “当前智能体”, “本智能体”, and “你自己” always mean that current Agent; do not
  substitute a key from Runtime Context: Sub-Agent Candidates.
clientVisible: true
explicitOnly: true
readOnly: false
inputSchema:
  type: object
  properties:
    message:
      type: string
      minLength: 1
      description: Required. Task message to send to the target Agent or Team.
    agentKey:
      type: string
      minLength: 1
      description: Optional. Exact catalog key of the target Agent. Provide exactly one of agentKey or teamId. When targeting the current Agent, use the exact Agent Identity.key from the current system prompt.
    teamId:
      type: string
      minLength: 1
      description: Optional. Exact catalog ID of the target Team. Provide exactly one of agentKey or teamId.
    chatId:
      type: string
      minLength: 1
      description: Optional. Existing Chat owned by the selected target to continue.
  required:
    - message
  additionalProperties: false
