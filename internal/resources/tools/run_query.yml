name: run_query
label: 发起独立运行
description: Start an independent root run for exactly one catalog Agent or Team and return its chatId and runId immediately. This tool does not wait for the target result, and the target continues if the caller run is interrupted. Use agent_invoke instead when the current response must wait for and consume sub-agent results.
clientVisible: true
explicitOnly: true
readOnly: false
inputSchema:
  type: object
  oneOf:
    - type: object
      properties:
        message:
          type: string
          minLength: 1
          description: Required. Task message to send to the target Agent.
        agentKey:
          type: string
          minLength: 1
          description: Required. Exact catalog key of the target Agent.
        chatId:
          type: string
          minLength: 1
          description: Optional. Existing chat owned by the target Agent to continue.
      required:
        - message
        - agentKey
      additionalProperties: false
    - type: object
      properties:
        message:
          type: string
          minLength: 1
          description: Required. Task message to send to the target Team.
        teamId:
          type: string
          minLength: 1
          description: Required. Exact catalog ID of the target Team.
        chatId:
          type: string
          minLength: 1
          description: Optional. Existing chat owned by the target Team to continue.
      required:
        - message
        - teamId
      additionalProperties: false
