name: kbase_files
i18n:
  en:
    label: "Browse Knowledge Base Files"
  zh-CN:
    label: "浏览知识库文件"
description: List files and compact directory tree entries from the current KBX index. This reads indexed KBX metadata only, not the host filesystem.
clientVisible: true
readOnly: true
inputSchema:
  type: object
  properties:
    mode:
      type: string
      enum:
        - files
        - tree
      default: files
      description: files returns a flat path list; tree returns compact directory and file entries.
    path:
      type: string
      description: Collection-prefixed directory or path prefix. Defaults to the knowledge base root.
    pattern:
      type: string
      description: KBASE glob matched relative to path. Defaults to **. Supports *, ?, and **.
    status:
      type: string
      enum:
        - active
      default: active
      description: KBX currently exposes active indexed files only.
    type:
      type: string
      description: Optional file extension filter such as md or .pdf.
    depth:
      type: integer
      description: Maximum tree depth for mode=tree. Defaults to 2 and is capped at 8.
    headLimit:
      type: integer
      description: Maximum number of entries to return after offset. Defaults to 100; 0 means unlimited.
    offset:
      type: integer
      description: Number of entries to skip before applying headLimit.
  additionalProperties: false
