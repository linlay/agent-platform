name: kbase_files
i18n:
  en:
    label: "Browse Knowledge Base Files"
  zh-CN:
    label: "浏览知识库文件"
description: "List indexed files or a directory tree from a knowledge library. Read the kbase-control skill before use."
clientVisible: true
readOnly: true
inputSchema:
  type: object
  properties:
    libraryId:
      type: string
      minLength: 1
      description: "Required. Knowledge library ID."
    mode:
      type: string
      enum:
        - files
        - tree
      default: files
      description: "Flat list or tree."
    path:
      type: string
      description: "Collection-prefixed directory or path prefix."
    pattern:
      type: string
      description: "Glob relative to path."
    status:
      type: string
      enum:
        - active
      default: active
      description: "Index status filter."
    type:
      type: string
      description: "File extension filter."
    depth:
      type: integer
      description: "Maximum tree depth."
    headLimit:
      type: integer
      description: "Maximum entries to return."
    offset:
      type: integer
      description: "Entries to skip."
  required: [libraryId]
  additionalProperties: false
