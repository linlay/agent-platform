name: awcp_invoke
i18n:
  en:
    label: "Website Action"
  zh-CN:
    label: "网站动作"
description: "Invoke one business action documented in a website's AWCP manual. Read the web-control skill before use."
clientVisible: true
inputSchema:
  type: object
  properties:
    surfaceId:
      type: string
      description: "Webpage identity."
    paramsFile:
      type: string
      description: "JSON file path for the invocation."
    revision:
      type: string
      description: "Manual revision."
    action:
      type: string
      description: "Section name."
    args:
      type: object
      description: "Action arguments."
      additionalProperties: true
  additionalProperties: false
