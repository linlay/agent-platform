name: plan_update_task
label: 更新任务
description: "Update one task in the ordered plan. Tasks run one at a time: only the first non-terminal task may move from init to in_progress, and only the current in_progress task may move to completed, failed, or canceled. Same-status updates are idempotent and may update description. Terminal tasks cannot be restarted; append a new task to retry."
clientVisible: true
inputSchema:
  type: object
  properties:
    taskId:
      type: string
      description: Required. taskId of the task to update.
    status:
      type: string
      description: Required. New task status. Legal changes are init to in_progress, in_progress to completed/failed/canceled, or an idempotent same-status update.
      enum:
        - init
        - in_progress
        - completed
        - failed
        - canceled
    description:
      type: string
      description: Optional updated task description. Only provide this when the description itself needs to change.
  required:
    - taskId
    - status
  additionalProperties: false
