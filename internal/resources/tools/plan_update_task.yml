name: plan_update_task
label: 更新任务
description: "Update one task in the optional ordered plan. Only the first non-terminal task may be updated from init, either through init -> in_progress -> completed/failed/canceled or directly through init -> completed/failed/canceled. If a task is in_progress, only that current task may move to completed, failed, or canceled; later tasks remain blocked. Same-status updates are idempotent and may update description. Terminal tasks cannot be restarted; append a new task to retry."
clientVisible: true
inputSchema:
  type: object
  properties:
    taskId:
      type: string
      description: Required. taskId of the task to update.
    status:
      type: string
      description: Required. New task status. Legal changes are init to in_progress/completed/failed/canceled, in_progress to completed/failed/canceled, or an idempotent same-status update, subject to ordered execution and the single-active-task rule.
      enum:
        - init
        - in_progress
        - completed
        - failed
        - canceled
    description:
      type: string
      description: Optional updated task description. Only provide this when the description itself needs to change.
  required:
    - taskId
    - status
  additionalProperties: false
