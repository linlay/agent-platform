name: "desktop_service"
label: "桌面服务"
i18n:
  en:
    label: "Desktop Services"
  zh-CN:
    label: "桌面服务"
description: "desktop_service: controlCenter.listServices, controlCenter.getServiceStatus, controlCenter.getServiceDetail, controlCenter.getServiceLogsMeta, controlCenter.readServiceLog, controlCenter.openService, controlCenter.openLogViewer, controlCenter.installService, controlCenter.initializeService, controlCenter.startService, controlCenter.stopService, controlCenter.restartService. Call with action and args. Desktop validates action arguments. Read the platform-control skill domain reference. Page control belongs to web-control."
clientVisible: true
explicitOnly: true
readOnly: false
operationAware: true
tags:
  - "platform"
  - "management"
inputSchema:
  type: "object"
  properties:
    action:
      description: "Required. Exact action owned by this tool; see its mounted skill reference."
      type: "string"
      enum:
        - "controlCenter.listServices"
        - "controlCenter.getServiceStatus"
        - "controlCenter.getServiceDetail"
        - "controlCenter.getServiceLogsMeta"
        - "controlCenter.readServiceLog"
        - "controlCenter.openService"
        - "controlCenter.openLogViewer"
        - "controlCenter.installService"
        - "controlCenter.initializeService"
        - "controlCenter.startService"
        - "controlCenter.stopService"
        - "controlCenter.restartService"
    args:
      type: "object"
      description: "Optional. Action-specific arguments; see the mounted platform-control skill."
  required:
    - "action"
  additionalProperties: false
