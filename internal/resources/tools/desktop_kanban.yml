name: "desktop_kanban"
i18n:
  en:
    label: "Desktop Kanban"
  zh-CN:
    label: "桌面看板"
description: "Manage Desktop kanban issues and their workflow. Read the kanban-control skill before use."
clientVisible: true
explicitOnly: true
readOnly: false
operationAware: true
tags:
  - "platform"
  - "management"
confirmationRules:
  - when:
      /action: kanban.createIssue
    viewportType: html
    viewportKey: desktop_kanban_review
  - when:
      /action: kanban.updateIssue
    viewportType: html
    viewportKey: desktop_kanban_review
  - when:
      /action: kanban.deleteIssue
    viewportType: html
    viewportKey: desktop_kanban_review
  - when:
      /action: kanban.moveIssue
    viewportType: html
    viewportKey: desktop_kanban_review
inputSchema:
  type: "object"
  properties:
    action:
      description: "Required. Exact action owned by this tool; see its mounted skill reference."
      type: "string"
      enum:
        - "kanban.listIssues"
        - "kanban.getIssue"
        - "kanban.createIssue"
        - "kanban.updateIssue"
        - "kanban.deleteIssue"
        - "kanban.moveIssue"
    args:
      type: "object"
      description: "Action-specific arguments; see the kanban-control skill's kanban reference."
  required:
    - "action"
  additionalProperties: false
