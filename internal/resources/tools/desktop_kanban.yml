name: "desktop_kanban"
i18n:
  en:
    label: "Desktop Kanban"
  zh-CN:
    label: "桌面看板"
description: "Manage local Desktop Kanban issues with action and args. For execution after creation, set args.input.status to todo and args.input.assigneeAgentKey to the actual executor key. Omitted status defaults to backlog, which does not auto-run. With Kanban enabled, eligible local todo issues auto-run without an extra run or move; scheduled automation uses its own trigger. Desktop owns results/workflow. Read the kanban-control reference before mutations. Page control uses web-control."
clientVisible: true
explicitOnly: true
readOnly: false
operationAware: true
tags:
  - "platform"
  - "management"
confirmationRules:
  - when:
      /action: kanban.createIssue
    viewportType: html
    viewportKey: desktop_kanban_review
  - when:
      /action: kanban.updateIssue
    viewportType: html
    viewportKey: desktop_kanban_review
  - when:
      /action: kanban.deleteIssue
    viewportType: html
    viewportKey: desktop_kanban_review
  - when:
      /action: kanban.moveIssue
    viewportType: html
    viewportKey: desktop_kanban_review
inputSchema:
  type: "object"
  properties:
    action:
      description: "Required. Exact action owned by this tool; see its mounted skill reference."
      type: "string"
      enum:
        - "kanban.listIssues"
        - "kanban.getIssue"
        - "kanban.createIssue"
        - "kanban.updateIssue"
        - "kanban.deleteIssue"
        - "kanban.moveIssue"
    args:
      type: "object"
      description: >-
        Action-specific arguments. Create for execution:
        {"input":{"title":"<task-title>","status":"todo","assigneeAgentKey":"<agent-key>"}}.
        Replace placeholders with actual values; see the kanban-control reference for other actions.
  required:
    - "action"
  additionalProperties: false
