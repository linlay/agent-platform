name: "desktop_kanban"
i18n:
  en:
    label: "Desktop Kanban"
  zh-CN:
    label: "桌面看板"
description: "desktop_kanban: kanban.listIssues, kanban.getIssue, kanban.createIssue, kanban.updateIssue, kanban.deleteIssue, kanban.moveIssue. Call with action and args. Desktop automatically runs eligible assigned todo issues and maintains results/workflow; creation needs no extra run or move call. Desktop validates action arguments. Read the platform-control skill domain reference. Page control belongs to web-control."
clientVisible: true
explicitOnly: true
readOnly: false
operationAware: true
tags:
  - "platform"
  - "management"
confirmationRules:
  - when:
      /action: kanban.createIssue
    viewportType: html
    viewportKey: desktop_kanban_review
  - when:
      /action: kanban.updateIssue
    viewportType: html
    viewportKey: desktop_kanban_review
  - when:
      /action: kanban.deleteIssue
    viewportType: html
    viewportKey: desktop_kanban_review
  - when:
      /action: kanban.moveIssue
    viewportType: html
    viewportKey: desktop_kanban_review
inputSchema:
  type: "object"
  properties:
    action:
      description: "Required. Exact action owned by this tool; see its mounted skill reference."
      type: "string"
      enum:
        - "kanban.listIssues"
        - "kanban.getIssue"
        - "kanban.createIssue"
        - "kanban.updateIssue"
        - "kanban.deleteIssue"
        - "kanban.moveIssue"
    args:
      type: "object"
      description: "Optional. Action-specific arguments; see the mounted platform-control skill."
  required:
    - "action"
  additionalProperties: false
