name: "desktop_kanban"
i18n:
  en:
    label: "Desktop Kanban"
  zh-CN:
    label: "桌面看板"
description: "Manage Desktop kanban issues and their workflow. Read the kanban-control skill before use."
clientVisible: true
explicitOnly: true
readOnly: false
operationAware: true
tags:
  - "platform"
  - "management"
confirmationRules:
  - when:
      /action: kanban.createIssue
    view: {key: desktop_kanban_review}
  - when:
      /action: kanban.updateIssue
    view: {key: desktop_kanban_review}
  - when:
      /action: kanban.deleteIssue
    view: {key: desktop_kanban_review}
  - when:
      /action: kanban.moveIssue
    view: {key: desktop_kanban_review}
inputSchema:
  type: "object"
  properties:
    action:
      type: "string"
      enum:
        - "kanban.listIssues"
        - "kanban.getIssue"
        - "kanban.createIssue"
        - "kanban.updateIssue"
        - "kanban.deleteIssue"
        - "kanban.moveIssue"
    args:
      type: "object"
      description: "See its skill."
  required:
    - "action"
  additionalProperties: false
