name: "chat_manage"
i18n:
  en:
    label: "Manage Chats"
  zh-CN:
    label: "管理会话"
description: "Manage conversation lifecycle and organization. Read the task-control skill before use."
clientVisible: true
explicitOnly: true
readOnly: false
operationAware: true
tags:
  - "platform"
  - "management"
confirmationRules:
  - when:
      /action: delete
    viewportType: html
    viewportKey: chat_delete_review
inputSchema:
  type: "object"
  properties:
    action:
      description: "Required. Exact action owned by this tool; see its mounted skill reference."
      type: "string"
      enum:
        - "rename"
        - "setPinned"
        - "archive"
        - "restore"
        - "fork"
        - "export"
        - "delete"
    args:
      type: "object"
      description: "Action-specific arguments; see the task-control skill's conversation reference."
  required:
    - "action"
  additionalProperties: false
