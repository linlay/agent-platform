name: "desktop_market"
i18n:
  en:
    label: "Desktop Market"
  zh-CN:
    label: "桌面市场"
description: "Manage Desktop marketplace resources. Read the platform-control skill before use."
clientVisible: true
explicitOnly: true
readOnly: false
operationAware: true
tags:
  - "platform"
  - "management"
inputSchema:
  type: "object"
  properties:
    action:
      type: "string"
      enum:
        - "market.getSettings"
        - "market.validateSettings"
        - "market.previewSettingsPatch"
        - "market.applySettingsPatch"
        - "market.listItems"
        - "market.getItemDetail"
        - "market.refresh"
        - "market.installItem"
        - "market.updateItem"
        - "market.uninstallItem"
        - "market.openItem"
        - "market.importSkill"
        - "market.importSandboxImage"
        - "market.exportSandboxImage"
        - "market.deleteSandboxImage"
    args:
      type: "object"
      description: "See its skill."
  required:
    - "action"
  additionalProperties: false
