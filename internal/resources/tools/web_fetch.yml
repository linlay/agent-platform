name: web_fetch
i18n:
  en:
    label: "Fetch Webpage"
  zh-CN:
    label: "网页抓取"
description: Fetch a public HTTP(S) URL, convert the content to markdown-like text, and apply a prompt using the configured small model. Use this for public web pages; authenticated or private URLs are not supported. A non-2xx HTTP response fails with web_fetch_http_error and a cross-host redirect fails with web_fetch_cross_host_redirect (call again with the redirect URL); neither returns page content.
inputSchema:
  type: object
  properties:
    url:
      type: string
      description: Required. Public http or https URL to fetch. Private, localhost, credentialed, and internal network URLs are rejected.
    prompt:
      type: string
      description: Required. Instruction to apply to the fetched content, such as summarize, extract facts, or answer a question from the page.
    profile:
      type: string
      description: Optional. Profile name from configs/tools.yml > web-fetch. Defaults to default-profile.
  required:
    - url
    - prompt
  additionalProperties: false
