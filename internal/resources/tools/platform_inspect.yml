name: "platform_inspect"
i18n:
  en:
    label: "Platform Diagnostics"
  zh-CN:
    label: "平台诊断"
description: "Inspect Platform runtime health, access policies, and HTTP MCP connector connectivity. Read the platform-control skill before use."
clientVisible: true
explicitOnly: true
readOnly: true
operationAware: true
tags:
  - "platform"
  - "management"
inputSchema:
  type: "object"
  properties:
    action:
      type: "string"
      enum:
        - "runtimeStatus"
        - "securityExplain"
        - "checkConnector"
    args:
      type: "object"
      description: "See its skill."
  required:
    - "action"
  additionalProperties: false
