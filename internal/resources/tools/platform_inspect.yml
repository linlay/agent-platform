name: "platform_inspect"
i18n:
  en:
    label: "Platform Diagnostics"
  zh-CN:
    label: "平台诊断"
description: "Inspect Platform runtime health and access policies. Read the platform-control skill before use."
clientVisible: true
explicitOnly: true
readOnly: true
operationAware: true
tags:
  - "platform"
  - "management"
inputSchema:
  type: "object"
  properties:
    action:
      description: "Required. Exact action owned by this tool; see its mounted skill reference."
      type: "string"
      enum:
        - "runtimeStatus"
        - "securityExplain"
    args:
      type: "object"
      description: "Action-specific arguments; see the platform-control skill."
  required:
    - "action"
  additionalProperties: false
