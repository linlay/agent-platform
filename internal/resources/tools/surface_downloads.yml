name: surface_downloads
i18n:
  en:
    label: "Save Page Downloads"
  zh-CN:
    label: "保存网页下载文件"
description: "List webpage downloads or persist a selected download to the current Chat. Read the web-control skill before use."
clientVisible: true
inputSchema:
  type: object
  properties:
    surfaceId:
      type: string
      description: "Required. Webpage identity."
    action:
      type: string
      enum:
        - list
        - save
      description: "Required. List captured downloads or verify and save one to this Chat; see the web-control skill."
    downloadId:
      type: string
      description: "Required for save; download identity returned by list."
  required:
    - surfaceId
    - action
  additionalProperties: false
