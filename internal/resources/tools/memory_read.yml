name: memory_read
i18n:
  en:
    label: "Read Memory"
  zh-CN:
    label: "读取记忆"
description: Read the current personal Markdown document and its revision before editing.
clientVisible: false
inputSchema:
  type: object
  additionalProperties: false
  properties:
    kind:
      description: Required. Personal profile, long-term memory, or a dated note.
      type: string
      enum:
        - owner
        - memory
        - summary
        - daily
    date:
      type: string
      description: Optional. Daily date YYYY-MM-DD, defaults to today in the Platform memory timezone.
  required:
    - kind
