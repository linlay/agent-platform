name: bash
i18n:
  en:
    label: "Run Command"
  zh-CN:
    label: "执行命令"
description: |
  Run allowlisted host shell commands. Windows runs through PowerShell by default; Unix/macOS run through bash/sh.
  Use bash for running commands, tests, builds, package managers, git, and other terminal operations. When file_write/file_edit are available, create or edit files with those tools first, then use bash only to run them.
  A script this run wrote into @chat with file_write (and file_edit afterwards), still unchanged, runs without approval; write one-off scripts there. Other scripts, including those in @temp or /tmp, and custom executables need approval at the default access level. Only the script's own entry is exempt, not other commands or path rules.
  The command string does not expand @chat or @temp: use the absolute filePath returned by file_write, or set cwd to the root and use a relative file name.
  Use the cwd parameter for directory changes; do not inline `cd /path && ...` when cwd can express the target directory.
  Shell syntax may be available, but security policy can block control operators, redirections, substitutions, and opaque scripts.
  Avoid writing commands like `cd /path && command`, `cmd1; cmd2`, `cmd1 && cmd2`, `cmd1 || cmd2`, `cmd1 | cmd2`, `cmd > file`, `cmd 2>&1`, `cmd >/dev/null 2>&1`, `$(cmd)`, backticks, heredocs, `eval`, `source`, or background jobs with `&`.
  When calling this tool, optionally include a short Chinese description explaining the command purpose.
inputSchema:
  type: object
  properties:
    command:
      type: string
      description: Required. Host shell command. Prefer a single executable command. Use cwd for working directory changes instead of `cd /path && ...`. Avoid shell control operators, pipes, redirections, command substitutions, heredocs, eval/source, and background jobs unless strictly required.
    description:
      type: string
      description: Optional. A short Chinese sentence describing the command purpose, shown during human approval. Defaults to a command summary when omitted.
    cwd:
      type: string
      description: Optional cwd for this invocation. Defaults explicitly to the current Workspace. Supported semantic roots include @workspace, @chat, @agent, @skills, @skills-center, @owner, @runtime, and @temp. If no Workspace exists, the effective session schema requires cwd; normally use @chat or @temp.
    timeout:
      type: integer
      description: Requested execution timeout in seconds. It defaults to the effective budget.tool.timeout and is capped by that tool budget.
  required:
    - command
  additionalProperties: false
