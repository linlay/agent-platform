        - "delete"
    args:
      type: "object"
      description: "apply: resourceType, resourceKey, content, path?, baseRevision?, preservePaths?, mcpUrl?. delete: resourceType, resourceKey, baseRevision. Updates require the current baseRevision; new targets omit it. mcpUrl creates a new HTTP MCP connector with generated mcp.json; use auth_mode=mcp for standard OAuth discovery or no_auth. Every mutation requires single-use approval."
  required:
