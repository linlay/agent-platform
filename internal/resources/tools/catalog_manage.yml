name: "catalog_manage"
i18n:
  en:
    label: "Manage Catalog"
  zh-CN:
    label: "管理目录"
description: "Manage Platform resource definitions. Read the platform-control skill before use."
clientVisible: true
explicitOnly: true
readOnly: false
operationAware: true
tags:
  - "platform"
  - "management"
confirmationRules:
  - when:
      /action: delete
    viewportType: html
    viewportKey: resource_delete_review
  - viewportType: html
    viewportKey: platform_control_review
inputSchema:
  type: "object"
  properties:
    action:
      description: "Required. Exact action owned by this tool; see its mounted skill reference."
      type: "string"
      enum:
        - "apply"
        - "delete"
    args:
      type: "object"
      description: "Action-specific arguments; see the platform-control skill's catalog reference."
  required:
    - "action"
  additionalProperties: false
