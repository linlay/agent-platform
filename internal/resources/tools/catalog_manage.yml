name: "catalog_manage"
i18n:
  en:
    label: "Manage Catalog"
  zh-CN:
    label: "管理目录"
description: "Manage Platform resource definitions. Read the platform-control skill before use."
clientVisible: true
explicitOnly: true
readOnly: false
operationAware: true
tags:
  - "platform"
  - "management"
confirmationRules:
  - when:
      /action: delete
    view: {key: resource_delete_review}
  - view: {key: platform_control_review}
inputSchema:
  type: "object"
  properties:
    action:
      type: "string"
      enum:
        - "apply"
        - "delete"
    args:
      type: "object"
      description: "See its skill."
  required:
    - "action"
  additionalProperties: false
