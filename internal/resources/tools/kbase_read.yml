name: kbase_read
i18n:
  en:
    label: "Read Knowledge Base Excerpt"
  zh-CN:
    label: "读取知识库片段"
activityArgs: [path]
description: "Read an evidence range by chunkId or indexed text by source path. Read the kbase-control skill before use."
clientVisible: true
readOnly: true
inputSchema:
  type: object
  properties:
    libraryId:
      type: string
      minLength: 1
      description: "Required. Knowledge library ID."
    chunkId:
      type: string
      description: "Evidence locator from a search hit or a previous read."
    path:
      type: string
      description: "Collection-prefixed source path."
    offset:
      type: integer
      description: "One-based line offset."
    limit:
      type: integer
      description: "Maximum lines."
  required: [libraryId]
  additionalProperties: false
