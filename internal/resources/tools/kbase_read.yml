name: kbase_read
i18n:
  en:
    label: "Read Knowledge Base Excerpt"
  zh-CN:
    label: "读取知识库片段"
description: Read the exact KBX evidence range by chunkId, or read the indexed extracted text by source path. Line numbers refer to extracted text.
clientVisible: true
readOnly: true
inputSchema:
  type: object
  properties:
    chunkId:
      type: string
      description: Content-addressed chunkId or evidenceId returned by kbase_search, including graph edge evidenceId, or nextEvidence from a previous read. Returns that exact range. Do not combine with offset or limit.
    path:
      type: string
      description: Workspace-relative source path.
    offset:
      type: integer
      description: One-based source line offset when reading by path.
    limit:
      type: integer
      description: Maximum source lines when reading by path.
  additionalProperties: false
