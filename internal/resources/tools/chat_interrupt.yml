name: chat_interrupt
i18n:
  en:
    label: "Interrupt Chat Run"
  zh-CN:
    label: "中断会话运行"
description: Interrupt an independent run previously created by chat_start for this caller and subject. Do not use this tool for the current run or for agent_invoke or agent_delegate child tasks.
clientVisible: true
explicitOnly: true
readOnly: false
inputSchema:
  type: object
  properties:
    runId:
      type: string
      minLength: 1
      description: Required. Run ID returned by chat_start. Identifies one execution within a Chat, not the Chat itself.
    message:
      type: string
      description: Optional. Reason or detail to attach to the interrupt request.
  required:
    - runId
  additionalProperties: false
