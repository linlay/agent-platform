name: chat_interrupt
i18n:
  en:
    label: "Interrupt Chat Run"
  zh-CN:
    label: "中断会话运行"
description: "Interrupt an independent run started by chat_start. Read the task-control skill before use."
clientVisible: true
explicitOnly: true
readOnly: false
inputSchema:
  type: object
  properties:
    runId:
      type: string
      minLength: 1
      description: "Required. Run ID returned by chat_start."
    message:
      type: string
      description: "Interrupt reason."
  required:
    - runId
  additionalProperties: false
