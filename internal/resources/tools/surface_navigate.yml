name: surface_navigate
i18n:
  en:
    label: "Navigate Page"
  zh-CN:
    label: "网页导航"
description: "Navigate inside an existing webpage. Read the web-control skill before use."
clientVisible: true
inputSchema:
  type: object
  properties:
    surfaceId:
      type: string
      description: "Required. Webpage identity."
    action:
      type: string
      enum:
        - goto
        - reload
        - back
      description: "Required. Navigation action."
    url:
      type: string
      description: "Destination address."
    ignoreCache:
      type: boolean
      description: "WorkPanel only. Bypass the cache when reloading."
  required:
    - surfaceId
    - action
  additionalProperties: false
