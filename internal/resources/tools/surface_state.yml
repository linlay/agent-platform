name: surface_state
label: 网页状态
description: "Read the state of one webpage. Omit surfaceId to read the current page of the application this Run belongs to; an ordinary Chat may have no current page, so pass the surfaceId from workpanel_open or surface_list."
clientVisible: true
readOnly: true
inputSchema:
  type: object
  properties:
    surfaceId:
      type: string
      description: Exact webpage identity returned by workpanel_open or surface_list. Omit only to read the owning application's current page.
  additionalProperties: false
