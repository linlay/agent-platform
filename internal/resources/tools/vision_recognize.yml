name: vision_recognize
label: "图像识别"
i18n:
  en:
    label: "Analyze Image"
  zh-CN:
    label: "图像识别"
description: Recognize images through the globally configured vision model. Use this when the active model cannot inspect images directly, or when OCR/visual extraction is needed as a tool result. Always pass images as a JSON array, even for one image.
explicitOnly: true
inputSchema:
  type: object
  properties:
    images:
      type: array
      description: 'Required. Images to recognize. Always pass an array, even for one image. Each item must provide exactly one source, for example: [{"referenceName":"image.png"}] or [{"filePath":"@chat/image.png"}].'
      minItems: 1
      items:
        type: object
        properties:
          referenceName:
            type: string
            description: Current chat attachment file name to inspect. The name must not include path separators.
          filePath:
            type: string
            description: Explicit host image file path to inspect. Semantic roots such as @chat, @agent, @skills, and @temp are supported. This path is checked by access-policy rules in configs/tools.yml.
        additionalProperties: false
    prompt:
      type: string
      description: Required. Recognition instruction, such as what to describe, extract, compare, or transcribe.
    profile:
      type: string
      description: Optional. Profile name from configs/ai-tools.yml > vision-recognize. Defaults to default-profile.
    outputFormat:
      type: string
      description: Optional. Desired result shape. Supports text or json, overriding the selected profile.
      enum:
        - text
        - json
  required:
    - images
    - prompt
  additionalProperties: false
