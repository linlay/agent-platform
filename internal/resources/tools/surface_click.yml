name: surface_click
i18n:
  en:
    label: "Click Page"
  zh-CN:
    label: "网页点击"
description: "Click in a webpage by selector or coordinates. Read the web-control skill before use."
clientVisible: true
inputSchema:
  type: object
  properties:
    surfaceId:
      type: string
      description: "Required. Webpage identity."
    selector:
      type: string
      description: "CSS selector."
    x:
      type: number
      description: "Horizontal position."
    y:
      type: number
      description: "Vertical position."
    waitFor:
      type: object
      description: "Condition to observe after the click."
      additionalProperties: true
  required:
    - surfaceId
  additionalProperties: false
