name: surface_click
i18n:
  en:
    label: "Click Page"
  zh-CN:
    label: "网页点击"
description: "Click a webpage element by observation reference, selector or coordinates. Read the web-control skill before use."
clientVisible: true
inputSchema:
  type: object
  properties:
    surfaceId:
      type: string
      description: "Required. Page surfaceId."
    selector:
      type: string
      description: "CSS selector."
    ref:
      type: string
      description: "Element reference from surface_observe. Requires observationId; mutually exclusive with selector and coordinates."
    observationId:
      type: string
      description: "Observation that issued ref. Required with ref."
    x:
      type: number
      description: "Horizontal position."
    y:
      type: number
      description: "Vertical position."
    waitFor:
      type: object
      description: "Condition to observe after the click."
      additionalProperties: true
    timeoutMs:
      type: integer
      minimum: 100
      maximum: 10000
      description: "Optional deadline in milliseconds for an observation-reference click."
    captureDownload:
      type: boolean
      description: "Optional, default false. Import this click's supported download into the Chat; see the web-control skill."
  required:
    - surfaceId
  additionalProperties: false
