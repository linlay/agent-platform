<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>产物导出</title><style>/* REVIEW_STYLES */</style></head>
<body><div id="review" aria-live="polite"></div>
<script>/* REVIEW_SCRIPT */</script>
<script>
Review.mount(u=>{
 const {t,args:a,current:c}=u;
 const formats={png:t('PNG 图片','PNG image'),html:t('HTML 网页文件','HTML document'),project:t('项目文件','Project file'),pdf:t('PDF 文档','PDF document')};
 u.title(t('导出应用产物','Export app artifact'));
 u.target(c.title||t('所选应用页面','Selected app page'),c.url||t('暂未读取到页面名称，请核对页面标识。','The page name is unavailable. Check the page ID.'),c.title?'':a.surfaceId);
 u.field(t('文件格式','File format'),formats[a.format]||a.format);
 u.field(t('保存位置','Save to'),t('此电脑的“下载”文件夹','This computer’s Downloads folder'));
 u.required(a.surfaceId,t('应用页面','App page'));u.required(a.format,t('导出格式','Export format'));u.extras(a,['surfaceId','format']);
});
</script></body></html>
