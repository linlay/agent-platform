<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>网站条目</title><style>/* REVIEW_STYLES */</style></head>
<body><div id="review" aria-live="polite"></div>
<script>/* REVIEW_SCRIPT */</script>
<script>
Review.mount(u=>{
 const {t,args:a,current:c,action}=u,add=action==='website.add',remove=action==='website.remove';
 let p=Object.keys(u.record(a.input)).length?u.record(a.input):Object.keys(u.record(a.patch)).length?u.record(a.patch):a;
 if(!['id','label','name','url','copilotAgentKey','agentKey'].some(k=>u.own(p,k))){
  if(Object.keys(u.record(p.item)).length)p=u.record(p.item);
  else if(Object.keys(u.record(p.website)).length)p=u.record(p.website);
  else if(Array.isArray(p.items)&&Object.keys(u.record(p.items[0])).length)p=u.record(p.items[0]);
 }
 const input={...p};if(typeof input.label!=='string'&&typeof input.name==='string')input.label=input.name;
 if((typeof input.copilotAgentKey!=='string'||!input.copilotAgentKey.trim())&&typeof input.agentKey==='string')input.copilotAgentKey=input.agentKey;
 const agent=v=>v?u.name(v):t('跟随桌面默认助理','Follow the Desktop default assistant');
 u.title(add?t('添加网站快捷入口','Add a website shortcut'):remove?t('移除网站快捷入口','Remove a website shortcut'):t('修改网站快捷入口','Edit a website shortcut'));
 u.target(add?(input.label||input.url||t('新网站','New website')):(c.label||t('所选网站','Selected website')),c.url||'',add?'':(!c.label?(a.websiteId||a.id):''));
 if(remove){if(c.url)u.field(t('网站地址','Website address'),c.url);u.notice(t('此操作只移除已保存的网站条目。需要时可重新添加。','Only the saved website entry is removed. You can add it again later.'),true);u.extras(a,['id','websiteId']);}
 else {
  for(const [key,label] of [['label',t('网站名称','Website name')],['url',t('访问地址','Address')],['copilotAgentKey',t('页面助理','Page assistant')]]){
   if(u.own(input,key))u.change(label,key,input[key],key==='copilotAgentKey'?agent:u.format);
  }
  if(add&&!u.own(input,'copilotAgentKey'))u.field(t('页面助理','Page assistant'),agent(''));
  if(add)u.required(input.url,t('网站地址','Website address'));
  u.extras(input,['label','name','url','copilotAgentKey','agentKey','id','websiteId']);

 }
 if(!add)u.required(a.websiteId||a.id,t('网站标识','Website ID'));

});
</script></body></html>
