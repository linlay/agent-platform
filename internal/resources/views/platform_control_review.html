<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>资源变更</title><style>/* REVIEW_STYLES */</style></head>
<body><div id="review" aria-live="polite"></div><script>/* REVIEW_SCRIPT */</script><script>
Review.mount(u=>{
 const {t,form:f}=u;
 const types={agent:t('智能体','agent'),team:t('团队','team'),skill:t('技能','skill'),connector:t('连接器','connector'),provider:t('服务商','provider'),model:t('模型','model')};
 const labels={name:t('名称','Name'),description:t('说明','Description'),model:t('模型','Model'),modelConfig:t('模型设置','Model settings'),mode:t('类型','Type'),engine:t('运行引擎','Engine'),prompt:t('指令','Instructions'),systemPrompt:t('系统指令','System instructions'),instructions:t('指令','Instructions'),toolConfig:t('工具','Tools'),connectorConfig:t('连接器','Connectors'),skillConfig:t('技能','Skills'),hostAccess:t('本机访问','Host access'),accessLevel:t('运行权限','Permissions'),runtimeConfig:t('运行设置','Runtime settings'),enabled:t('启用状态','Enabled'),members:t('团队成员','Team members'),provider:t('服务商','Provider'),baseUrl:t('服务地址','Service URL')};
 const critical=key=>/tool|connector|skill|access|permission|runtime/i.test(key);
 const simple=value=>{
  let s=String(value).trim();
  if(/^\|[-+]?\n/.test(s)) {
   const lines=s.split('\n').slice(1), indents=lines.filter(x=>x.trim()).map(x=>/^ */.exec(x)[0].length);
   const indent=indents.length?Math.min(...indents):0;return lines.map(x=>x.slice(indent)).join('\n');
  }
  const list=/^(?:tools|connectors|skills):\s*\n((?:[ \t]+- [^\n]+\n?)+)$/.exec(s);
  if(list)return list[1].trim().split('\n').map(x=>x.trim().replace(/^- /,'')).join('\n');
  try {const v=JSON.parse(s);if(typeof v==='string')return v;if(Array.isArray(v)&&v.every(x=>typeof x==='string'))return v.join('\n');}catch{}
  return ({default:t('默认','Default'),auto_approve:t('自动批准','Auto approve'),full_access:t('完全访问','Full access'),true:t('开启','On'),false:t('关闭','Off')})[s]||s;
 };
 // Split source into exact top-level spans, not an executable YAML parser.
 // Unsupported formats remain a complete text comparison; no environment expansion.
 function sections(source){
  if(!source)return {};
  try {
   const v=JSON.parse(source);
   if(v&&typeof v==='object'&&!Array.isArray(v))return Object.fromEntries(Object.entries(v).map(([k,v])=>[k,typeof v==='string'?v:JSON.stringify(v,null,2)]));
  }catch{}
  if(!['agent','team','provider','model'].includes(f.resourceType)||!(/\.ya?ml$/i.test(f.path||'')||!f.path))return null;
  const groups={};let key=null;
  for(const line of String(source).split('\n')){
   const match=/^([A-Za-z][\w-]*):(?:\s|$)(.*)$/.exec(line);
   if(match){key=match[1];if(Object.hasOwn(groups,key))return null;groups[key]=match[2];}
   else if(key)groups[key]+='\n'+line;
   else if(line.trim())return null;
  }
  return key?groups:null;
 }
 const before=String(f.before||''),after=String(f.after||''),old=sections(before),next=sections(after),create=!f.baseRevision;
 u.title((create?t('创建','Create '):t('修改','Update '))+(types[f.resourceType]||t('资源','resource')));
 const name=(create?next?.name:old?.name)||next?.name;
 u.target(name?simple(name):f.resourceKey);
 if(f.isProject)u.field(t('项目类型','Project type'),t('项目智能体','Project agent'));
 if(f.path&&!['agent.yml','team.yml'].includes(f.path))u.field(t('文件','File'),f.path);
 if(old&&next){
  const keys=[...new Set([...Object.keys(next),...Object.keys(old)])];
  let count=0;
  for(const key of keys){
   if(old[key]===next[key])continue;
   count++;
   const options={critical:critical(key),target:key==='name'},label=labels[key]||key;
   if(create) {if(key!=='name')u.field(label,simple(next[key]??''),options);}
   else u.compare(label,old[key],next[key],v=>v===undefined?t('未设置','Not set'):simple(v),options);
  }
  if(!count&&before!==after)u.compare(t('文件内容','File contents'),before,after);
  else if(!count)u.notice(t('内容没有变化','No content changes'));
 }else if(create)u.field(t('内容','Contents'),after);
 else u.compare(t('内容','Contents'),before,after);
});
</script></body></html>
