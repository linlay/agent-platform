<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Agents</title><link rel="stylesheet" href="list.css"></head>
<body data-resource-type="agent">
<header><h1 id="title"></h1><span class="count" id="count"></span><span class="spacer"></span>
<select id="status" aria-label="Status"><option value="all" data-i18n="all"></option><option value="valid" data-i18n="valid"></option><option value="invalid" data-i18n="invalid"></option></select>
<button id="refresh" data-i18n="refresh"></button></header>
<p id="notice" class="notice"></p><div id="body" aria-live="polite"></div>
<footer id="pager" hidden><button id="prev" data-i18n="prev"></button><button id="next" data-i18n="next"></button></footer>
<script src="list.js"></script></body></html>
