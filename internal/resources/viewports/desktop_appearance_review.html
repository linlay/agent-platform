<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>外观与偏好</title><style>/* REVIEW_STYLES */</style></head>
<body><div id="review" aria-live="polite"></div>
<script>/* REVIEW_SCRIPT */</script>
<script>
Review.mount(u=>{
 const {t,args:a,current:c,action}=u;
 const theme=v=>({light:t('浅色','Light'),dark:t('深色','Dark'),system:t('跟随系统','Follow system')}[v]||u.format(v));
 const locale=v=>({'zh-CN':'简体中文','en-US':'English'}[v]||u.format(v));
 const titles={'pet.import':t('导入桌宠','Import a pet'),'theme.set':t('切换桌面主题','Change Desktop theme'),'locale.set':t('切换界面语言','Change interface language'),'skin.import':t('导入新皮肤','Import a skin'),'skin.set':t('更换桌面皮肤','Change Desktop skin'),'skin.remove':t('删除已安装的皮肤','Remove an installed skin'),'pet.show':t('显示桌宠','Show your desktop pet'),'pet.hide':t('隐藏桌宠','Hide your desktop pet'),'pet.set':t('更换桌宠外观','Change your pet’s appearance'),'copilot.setPagePreference':t('调整页面助理','Change the page assistant')};
 u.title(titles[action]||t('调整桌面偏好','Change Desktop preferences'));
 switch(action){
 case 'theme.set':u.change(t('界面主题','Theme'),'themeMode',a.themeMode,theme);u.required(a.themeMode,t('主题','Theme'));u.extras(a,['themeMode']);break;
 case 'locale.set':u.change(t('界面语言','Language'),'locale',a.locale,locale);u.required(a.locale,t('语言','Language'));u.extras(a,['locale']);break;
 case 'pet.import':{
  const path=typeof a.filePath==='string'?a.filePath:'';u.target(path.split(/[\\/]/).pop()||t('未选择桌宠文件','No pet file selected'));u.field(t('文件位置','File location'),path);u.notice(t('导入后不切换当前桌宠。','Importing does not change the current pet.'));u.required(path,t('桌宠文件','Pet file'));u.extras(a,['filePath']);break;}
 case 'skin.import':{
  const path=typeof a.filePath==='string'?a.filePath:'';u.target(path.split(/[\\/]/).pop()||t('未选择皮肤文件','No skin file selected'),t('从本机 ZIP 文件导入','Import from a ZIP file on this computer'));u.field(t('文件位置','File location'),path);u.notice(t('仅安装皮肤，不会立即切换当前外观。','This installs the skin without changing your current appearance.'));u.required(path,t('皮肤文件','Skin file'));u.extras(a,['filePath']);break;}
 case 'skin.set':
  u.change(t('桌面皮肤','Skin'),'skinId',a.skinId,v=>u.name(v,t('默认皮肤','Default skin')));
  u.field(t('自定义背景','Custom background'),a.keepBackground===true?t('保留当前背景','Keep current background'):t('使用已安装皮肤时清除自定义背景','Clear the custom background when applying an installed skin'));
  u.required(a.skinId,t('皮肤','Skin'));u.extras(a,['skinId','keepBackground']);break;
 case 'skin.remove':u.target(u.name(a.skinId),t('将从已安装皮肤中移除','Will be removed from installed skins'));u.notice(t('若正在使用这套皮肤，桌面会恢复默认皮肤。原始 ZIP 文件不会被删除。','If this skin is active, Desktop will return to the default skin. The original ZIP file is kept.'),true);u.required(a.skinId,t('皮肤','Skin'));u.extras(a,['skinId']);break;
 case 'pet.show':case 'pet.hide':u.change(t('桌宠显示','Pet visibility'),'enabled',action==='pet.show',v=>v?t('显示','Visible'):t('隐藏','Hidden'));u.extras(a,[]);break;
 case 'pet.set':u.change(t('桌宠外观','Pet appearance'),'appearanceId',a.appearanceId||a.id,v=>u.name(v));u.required(a.appearanceId||a.id,t('桌宠外观','Pet appearance'));u.extras(a,['appearanceId','id']);break;
 case 'copilot.setPagePreference':{
  const pages={controlCenter:t('控制中心','Control Center'),market:t('市场','Market'),help:t('帮助','Help'),agents:t('智能体','Agents'),schedules:t('定时任务','Schedules'),skills:t('技能','Skills')};
  u.target(pages[a.pageKey]||a.pageKey||t('未指定页面','No page selected'),t('仅修改这个页面的助理设置','Only this page’s assistant settings will change'));
  if(u.own(a,'enabled'))u.change(t('页面助理','Page assistant'),'enabled',a.enabled);
  if(u.own(a,'agentKey'))u.change(t('使用的智能体','Selected agent'),'agentKey',a.agentKey,v=>v?u.name(v):t('跟随默认助理','Follow default assistant'));
  u.extras(a,['pageKey','enabled','agentKey']);break;}
 default:u.notice(t('无法识别这项外观设置，请拒绝并重新提交。','Unrecognized preference. Reject and request a new submission.'),true);
 }

});
</script></body></html>
