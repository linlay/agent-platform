<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'"><title>安装／升级确认</title><style>
:root { color-scheme: light dark; font: 14px/1.6 system-ui, sans-serif; color: #222; --muted: #69717d; --line: #d9dee5; --code: #f3f5f7; --add: #dff5e6; --remove: #ffe5e5; }
@media (prefers-color-scheme: dark) { :root { color: #eee; --muted: #a8aeb8; --line: #494d56; --code: #303238; --add: #163d2b; --remove: #4b262b; } }
:root[data-theme=dark] { color: #eee; --muted: #a8aeb8; --line: #494d56; --code: #303238; --add: #163d2b; --remove: #4b262b; }
:root[data-theme=light] { color: #222; --muted: #69717d; --line: #d9dee5; --code: #f3f5f7; --add: #dff5e6; --remove: #ffe5e5; }
* { box-sizing: border-box; }
body { margin: 0; padding: 8px 12px 16px; overflow-wrap: anywhere; }
h1 { margin: 0 0 4px; font-size: 16px; }
p { margin: 6px 0 12px; }
.target { font-weight: 600; }
.note, summary, .empty { color: var(--muted); }
#changes { margin: 12px 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.line { display: flex; white-space: pre-wrap; font: 12px/1.65 ui-monospace, SFMono-Regular, Consolas, monospace; }
.line span { flex: 0 0 22px; text-align: center; user-select: none; }
.line code { padding-right: 8px; min-width: 0; overflow-wrap: anywhere; }
.add { background: var(--add); }.remove { background: var(--remove); }
details { margin: 10px 0; } summary { cursor: pointer; }
pre { background: var(--code); padding: 12px; border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.65 ui-monospace, SFMono-Regular, Consolas, monospace; }

.card {border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0;} dl {margin:0;} dt {color:var(--muted);font-size:12px;margin-top:10px;} dd {margin:0;font-weight:600;} .warning {border-left:3px solid #d98537;padding:10px;background:var(--code);border-radius:4px;}</style></head><body><h1 id="heading"></h1><p class="note" id="intro"></p><div class="card"><dl><dt id="source-label"></dt><dd id="source"></dd><dt id="target-label"></dt><dd id="target"></dd><dt id="identity-label"></dt><dd id="identity"></dd><dt id="version-label"></dt><dd id="version"></dd></dl></div><p class="warning" id="warning"></p><p class="note" id="once"></p><script>(()=>{'use strict';let state=null;const el=id=>document.getElementById(id);const text=(id,value)=>{el(id).textContent=typeof value==='string'?value:'';};function render(data){state=data;const f=data.form||{},zh=String(data.locale||navigator.language).startsWith('zh');document.documentElement.lang=zh?'zh':'en';if(data.colorScheme==='dark'||data.colorScheme==='light'){document.documentElement.dataset.theme=data.colorScheme;document.documentElement.style.colorScheme=data.colorScheme;}

const local=f.action==='webapp.install', update=f.action==='market.updateItem';
const labels=zh?{install:'安装资源',update:'升级资源',local:'安装／更新本地 WebApp',intro:'核对安装来源与目标后，仅批准本次操作。',source:'安装来源',target:'目标资源／归档',identity:'预期应用标识',version:'版本信息',market:'Desktop 已配置的市场',archive:'当前工作区内的本地归档',unspecified:'未指定，由安装包校验确定',unknown:'尚未解析；安装时由 Desktop 获取并验证',warning:'安装可能下载资源并更改本机安装内容。这里确认的是操作与目标，不表示安装包已完成验证。',once:'批准后执行原始调用参数。取消或需要修改时，请在外层选择拒绝。'}:{install:'Install resource',update:'Update resource',local:'Install / update local WebApp',intro:'Review the source and target. Approval applies to this operation only.',source:'Installation source',target:'Target resource / archive',identity:'Expected application ID',version:'Version information',market:'Desktop configured marketplace',archive:'Local archive in the current workspace',unspecified:'Not specified; determined by package validation',unknown:'Not resolved yet; Desktop resolves and validates during installation',warning:'Installation may download resources and change local installed content. This approves the operation and target; it does not certify the package.',once:'Approval executes the original arguments. Reject in the host controls to cancel or request changes.'};
text('heading',local?labels.local:update?labels.update:labels.install);
for(const k of ['intro','warning','once'])text(k,labels[k]);
for(const k of ['source','target','identity','version'])text(k+'-label',labels[k]);
text('source',local?labels.archive:labels.market);text('target',local?f.workspaceArchivePath:f.itemId);text('identity',local?(f.expectedId||labels.unspecified):f.itemId);text('version',labels.unknown);
}
  addEventListener('message', event => {
    if (event.source !== parent) return;
    const message=event.data;
    if (!message || typeof message!=='object') return;
    if ((message.type==='awaiting_init' || message.type==='awaiting_update') && message.data?.mode==='form') render(message.data);
    if (message.type==='awaiting_collect' && state && message.data?.runId===state.runId && message.data?.awaitingId===state.awaitingId && message.data?.decision==='submit') {
      parent.postMessage({type:'frontend_awaiting_submit',params:[{id:state.activeFormId,decision:'approve',form:state.form || {}}]},'*');
    }
  });
})();</script></body></html>
