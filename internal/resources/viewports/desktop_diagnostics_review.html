<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>诊断读取</title><style>/* REVIEW_STYLES */</style></head>
<body><div id="review" aria-live="polite"></div>
<script>/* REVIEW_SCRIPT */</script>
<script>
Review.mount(u=>{
 const {t}=u;
 u.title(t('读取桌面诊断信息','Read Desktop diagnostics'));
 u.field(t('设备信息','Device information'),t('设备与系统的诊断信息','Device and system diagnostics'));
 u.field(t('本机路径','Local paths'),t('安装位置、运行目录等宿主路径','Host paths such as installation and runtime directories'));
 u.field(t('运行环境','Runtime'),t('Desktop、Electron 和 Node 等版本','Versions of Desktop, Electron and Node'));
 u.field(t('登录状态','Sign-in status'),t('SSO 登录凭据摘要；不包含凭据原文','SSO credential summary, without raw credentials'));
 u.field(t('内部服务','Internal services'),t('本机内部服务状态和诊断信息','Status and diagnostics of internal services'));
 u.notice(t('信息将提供给当前智能体，可能包含本机用户名和目录。','Shared with the current agent; may include local usernames and directories.'),true);
 u.extras(u.args,[]);
});
</script></body></html>
